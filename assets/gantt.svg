<svg xmlns="http://www.w3.org/2000/svg" class="gantt-root" viewBox="0 0 904 309" width="904" height="309" role="img" aria-label="Gantt · sweeping playhead">
  <defs>
    <style>
      .gantt-root {
        --mv-bg: #070B14;
        --mv-card: #0F172A;
        --mv-border: rgba(148,163,184,0.24);
        --mv-fg: #F8FAFC;
        --mv-muted: #94A3B8;
        --mv-title: #38BDF8;
        --mv-dot: rgba(148,163,184,0.14);
        --mv-hub-start: #1E293B;
        --mv-hub-end: #0F172A;
        --pele-series-1: #38BDF8;
        --pele-series-2: #818CF8;
        --pele-series-3: #FBBF24;
        --pele-series-4: #34D399;
        --pele-series-5: #F472B6;
        --pele-series-6: #FB7185;
        --pele-series-7: #A78BFA;
        --pele-series-8: #2DD4BF;
      }
      .gantt-bg { fill: var(--mv-bg); }
      .gantt-card { fill: var(--mv-card); stroke: var(--mv-border); stroke-width: 1.2; }
      .gantt-dot { fill: var(--mv-dot); }
      .gantt-title { font: 700 13px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 2px; fill: var(--mv-title); text-transform: uppercase; }
      .gantt-footer { font: 500 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--mv-muted); }
      .gantt-stage { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; fill: var(--mv-fg); }
      .pele-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: var(--mv-fg); }
      .pele-label tspan:first-child { font-size: 14.5px; font-weight: 700; fill: var(--mv-fg); }
      .pele-label tspan:nth-child(n+2) { font-size: 11.5px; font-weight: 400; fill: var(--mv-muted); }
      .pele-cluster-label { font-size: 12px; font-weight: 600; letter-spacing: 0.04em; fill: var(--mv-muted); }
      .pele-edge-label rect { fill: var(--mv-card); stroke: var(--mv-border); stroke-width: 1; rx: 6; }
      .pele-edge-label text { font-size: 12px; font-weight: 600; fill: var(--mv-fg); }
      .pele-branch .pele-label { font-size: 12px; font-weight: 700; fill: #070B14; }
      .pele-task .pele-label { font-size: 12px; font-weight: 700; fill: var(--mv-fg); }
      .pele-task .pele-label[fill] { fill: #070B14; }
      .pele-commit-label text { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; fill: var(--mv-muted); }
      .gantt-hub-node .pele-label tspan:first-child { font-size: 16px; font-weight: 700; fill: var(--mv-fg); }
      .gantt-hub-node .pele-label tspan:nth-child(n+2) { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; fill: var(--mv-title); }
      .gantt-flow { stroke-dasharray: 6 14; stroke-linecap: round; animation: gantt-dash 1.80s linear infinite; }
      .gantt-pulse { transform-box: fill-box; transform-origin: center; animation: gantt-ring 3.20s ease-in-out infinite; }
      @keyframes gantt-dash { to { stroke-dashoffset: -40; } }
      @keyframes gantt-ring {
        0%, 100% { opacity: 0.25; transform: scale(0.97); }
        50% { opacity: 0.65; transform: scale(1.03); }
      }
      .gantt-flash { opacity: 0.15; animation: gantt-flash 4s linear infinite; }
      @keyframes gantt-flash { 0% { opacity: 0.15; } 6% { opacity: 0.95; } 22%, 100% { opacity: 0.15; } }
      .gantt-working > rect { animation: gantt-working 3.20s ease-in-out infinite; }
      @keyframes gantt-working { 50% { fill-opacity: 0.55; } }
      @media (prefers-reduced-motion: reduce) {
        .gantt-flow, .gantt-pulse, .gantt-flash, .gantt-working > rect { animation: none; }
        /* SMIL ignores the media query: what moves by it (packets, playhead, markers) goes */
        .gantt-packets, .gantt-smil { display: none; }
      }
    </style>
    <pattern id="gantt-dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" class="gantt-dot"/>
    </pattern>
    <radialGradient id="gantt-glow-l" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gantt-glow-r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gantt-hub-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--mv-hub-start)"/>
      <stop offset="100%" stop-color="var(--mv-hub-end)"/>
    </linearGradient>
  </defs>

  <rect width="904" height="309" rx="18" class="gantt-bg"/>
  <rect width="904" height="309" rx="18" fill="url(#gantt-dots)"/>
  <circle cx="235" cy="111" r="253" fill="url(#gantt-glow-l)"/>
  <circle cx="669" cy="198" r="253" fill="url(#gantt-glow-r)"/>
  <text x="452" y="42" text-anchor="middle" class="gantt-title">Gantt · sweeping playhead</text>

  <g class="gantt-stage" transform="translate(52,76)" style="--_bg:var(--mv-bg);--_fg:var(--mv-fg);--_m:var(--mv-muted);--_l:#38BDF8;--_s:var(--mv-card);--_a:var(--mv-hub-start);--_b:var(--mv-border);--_c:#38BDF8;--_r:12px;--_w:700;--_hw:700;--_tw:700">
    <g class="pele-sections"><rect class="pele-section pele-section-0" x="0" y="8" width="800" height="60" fill="var(--_s)"/><rect class="pele-section pele-section-1" x="0" y="68" width="800" height="60" fill="none"/></g><g class="pele-grid" fill="none"><path d="M74.64,8V128M172.74,8V128M270.83,8V128M368.93,8V128M467.03,8V128M565.12,8V128M663.22,8V128M761.32,8V128" stroke="var(--_b)" stroke-dasharray="1 3"/><path d="M74.64,128H761.32" stroke="var(--_b)"/></g><g class="pele-tasks" font-size="13"><g class="pele-task pele-done" data-id="a1"><rect x="74.64" y="11" width="245.24" height="24" fill="#38BDF8" fill-opacity="0.18" stroke="#38BDF8" stroke-opacity="0.55" style="rx:var(--_r)"/><text class="pele-label" x="197.26" y="27.55" text-anchor="middle">Parser &amp; layout</text></g><g class="pele-task pele-active gantt-working" data-id="a2"><rect x="319.88" y="41" width="294.29" height="24" fill="#818CF8" fill-opacity="0.25" stroke="#818CF8" style="rx:var(--_r)"/><text class="pele-label" x="467.03" y="57.55" text-anchor="middle">Animations</text></g><g class="pele-task" data-id="a3"><rect x="614.17" y="71" width="147.14" height="24" fill="#FBBF24" stroke="#FBBF24" style="rx:var(--_r)"/><text class="pele-label" fill="var(--_bg)" x="687.74" y="87.55" text-anchor="middle">Docs &amp; assets</text></g><g class="pele-task pele-milestone" data-id="m1"><path d="M761.32,101L773.32,113L761.32,125L749.32,113Z" fill="#34D399" stroke="#34D399" stroke-linejoin="round"/><text class="pele-label" x="705.55" y="117.55" text-anchor="middle">npm release</text></g></g><g class="pele-section-labels" font-size="13"><text class="pele-section-label" data-id="Core" x="30.09" y="42.55" text-anchor="middle">Core</text><text class="pele-section-label" data-id="Launch" x="37.32" y="102.55" text-anchor="middle">Launch</text></g><g class="pele-axis" font-size="12" fill="var(--_m)"><text x="74.64" y="144.7" text-anchor="middle">2026-01-01</text><text x="172.74" y="144.7" text-anchor="middle">2026-01-03</text><text x="270.83" y="144.7" text-anchor="middle">2026-01-05</text><text x="368.93" y="144.7" text-anchor="middle">2026-01-07</text><text x="467.03" y="144.7" text-anchor="middle">2026-01-09</text><text x="565.12" y="144.7" text-anchor="middle">2026-01-11</text><text x="663.22" y="144.7" text-anchor="middle">2026-01-13</text><text x="761.32" y="144.7" text-anchor="middle">2026-01-15</text></g><g class="gantt-packets"><g class="gantt-playhead"><line x1="74.64" y1="4" x2="74.64" y2="130" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.75"/><circle cx="74.64" cy="4" r="3.5" fill="#38BDF8"/><animateTransform attributeName="transform" type="translate" from="0 0" to="686.7 0" dur="5.50s" begin="-1.60s" repeatCount="indefinite"/></g></g>
  </g>

  <rect x="272" y="257" width="360" height="30" rx="15" class="gantt-card"/>
  <text x="452" y="276" text-anchor="middle" class="gantt-footer">done tasks faded, the active one glowing</text>
</svg>
