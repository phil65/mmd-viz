<svg xmlns="http://www.w3.org/2000/svg" class="lighttd-root" viewBox="0 0 421 462" width="421" height="462" role="img" aria-label="Light theme · top-down architecture">
  <defs>
    <style>
      .lighttd-root {
        --mv-bg: #F8FAFC;
        --mv-card: #FFFFFF;
        --mv-border: rgba(148,163,184,0.45);
        --mv-fg: #0F172A;
        --mv-muted: #475569;
        --mv-title: #0284C7;
        --mv-dot: rgba(100,116,139,0.18);
        --mv-hub-start: #EFF6FF;
        --mv-hub-end: #FFFFFF;
        --pele-series-1: #38BDF8;
        --pele-series-2: #818CF8;
        --pele-series-3: #FBBF24;
        --pele-series-4: #34D399;
        --pele-series-5: #F472B6;
        --pele-series-6: #FB7185;
        --pele-series-7: #A78BFA;
        --pele-series-8: #2DD4BF;
      }
      .lighttd-bg { fill: var(--mv-bg); }
      .lighttd-card { fill: var(--mv-card); stroke: var(--mv-border); stroke-width: 1.2; }
      .lighttd-dot { fill: var(--mv-dot); }
      .lighttd-title { font: 700 13px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 2px; fill: var(--mv-title); text-transform: uppercase; }
      .lighttd-footer { font: 500 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--mv-muted); }
      .lighttd-stage { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; fill: var(--mv-fg); }
      .pele-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: var(--mv-fg); }
      .pele-label tspan:first-child { font-size: 14.5px; font-weight: 700; fill: var(--mv-fg); }
      .pele-label tspan:nth-child(n+2) { font-size: 11.5px; font-weight: 400; fill: var(--mv-muted); }
      .pele-cluster-label { font-size: 12px; font-weight: 600; letter-spacing: 0.04em; fill: var(--mv-muted); }
      .pele-edge-label rect { fill: var(--mv-card); stroke: var(--mv-border); stroke-width: 1; rx: 6; }
      .pele-edge-label text { font-size: 12px; font-weight: 600; fill: var(--mv-fg); }
      .pele-branch .pele-label { font-size: 12px; font-weight: 700; fill: #070B14; }
      .pele-task .pele-label { font-size: 12px; font-weight: 700; fill: var(--mv-fg); }
      .pele-task .pele-label[fill] { fill: #070B14; }
      .pele-commit-label text { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; fill: var(--mv-muted); }
      .lighttd-hub-node .pele-label tspan:first-child { font-size: 16px; font-weight: 700; fill: var(--mv-fg); }
      .lighttd-hub-node .pele-label tspan:nth-child(n+2) { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; fill: var(--mv-title); }
      .lighttd-flow { stroke-dasharray: 6 14; stroke-linecap: round; animation: lighttd-dash 1.80s linear infinite; }
      .lighttd-pulse { transform-box: fill-box; transform-origin: center; animation: lighttd-ring 3.20s ease-in-out infinite; }
      @keyframes lighttd-dash { to { stroke-dashoffset: -40; } }
      @keyframes lighttd-ring {
        0%, 100% { opacity: 0.25; transform: scale(0.97); }
        50% { opacity: 0.65; transform: scale(1.03); }
      }
      .lighttd-flash { opacity: 0.15; animation: lighttd-flash 4s linear infinite; }
      @keyframes lighttd-flash { 0% { opacity: 0.15; } 6% { opacity: 0.95; } 22%, 100% { opacity: 0.15; } }
      .lighttd-working > rect { animation: lighttd-working 3.20s ease-in-out infinite; }
      @keyframes lighttd-working { 50% { fill-opacity: 0.55; } }
      @media (prefers-reduced-motion: reduce) {
        .lighttd-flow, .lighttd-pulse, .lighttd-flash, .lighttd-working > rect { animation: none; }
        /* SMIL ignores the media query: what moves by it (packets, playhead, markers) goes */
        .lighttd-packets, .lighttd-smil { display: none; }
      }
    </style>
    <pattern id="lighttd-dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" class="lighttd-dot"/>
    </pattern>
    <radialGradient id="lighttd-glow-l" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lighttd-glow-r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lighttd-hub-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--mv-hub-start)"/>
      <stop offset="100%" stop-color="var(--mv-hub-end)"/>
    </linearGradient>
  </defs>

  <rect width="421" height="462" rx="18" class="lighttd-bg"/>
  <rect width="421" height="462" rx="18" fill="url(#lighttd-dots)"/>
  <circle cx="109" cy="166" r="118" fill="url(#lighttd-glow-l)"/>
  <circle cx="312" cy="296" r="118" fill="url(#lighttd-glow-r)"/>
  <text x="210.5" y="42" text-anchor="middle" class="lighttd-title">Light theme · top-down architecture</text>

  <g class="lighttd-stage" transform="translate(62,76)" style="--_bg:var(--mv-bg);--_fg:var(--mv-fg);--_m:var(--mv-muted);--_l:#38BDF8;--_s:var(--mv-card);--_a:var(--mv-hub-start);--_b:var(--mv-border);--_c:#38BDF8;--_r:12px;--_w:700;--_hw:700;--_tw:700">
    <g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge" data-id="L_ui_api_0"><path id="lighttd-edge-0" d="M71.99,74C71.99,91.5 139.98,91.5 139.98,109L139.98,115" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.38" fill="none"/><path d="M71.99,74C71.99,91.5 139.98,91.5 139.98,109L139.98,115" stroke="#38BDF8" stroke-width="2.2" fill="none" class="lighttd-flow"/><path class="pele-marker" d="M139.98,122L136.62,114L143.34,114Z" fill="#38BDF8" fill-opacity="0.88" stroke="none"/></g><g class="pele-edge" data-id="L_cli_api_0"><path id="lighttd-edge-1" d="M223.97,74C223.97,91.5 155.98,91.5 155.98,109L155.98,115" stroke="#818CF8" stroke-width="2" stroke-opacity="0.38" fill="none"/><path d="M223.97,74C223.97,91.5 155.98,91.5 155.98,109L155.98,115" stroke="#818CF8" stroke-width="2.2" fill="none" class="lighttd-flow"/><path class="pele-marker" d="M155.98,122L152.62,114L159.34,114Z" fill="#818CF8" fill-opacity="0.88" stroke="none"/></g><g class="pele-edge" data-id="L_api_db_0"><path id="lighttd-edge-2" d="M139.98,188C139.98,205.5 71.2,205.5 71.2,223L71.2,229" stroke="#34D399" stroke-width="2" stroke-opacity="0.38" fill="none"/><path d="M139.98,188C139.98,205.5 71.2,205.5 71.2,223L71.2,229" stroke="#34D399" stroke-width="2.2" fill="none" class="lighttd-flow"/><path class="pele-marker" d="M71.2,236L67.84,228L74.56,228Z" fill="#34D399" fill-opacity="0.88" stroke="none"/></g><g class="pele-edge" data-id="L_api_queue_0"><path id="lighttd-edge-3" d="M155.98,188C155.98,205.5 224.76,205.5 224.76,223L224.76,229" stroke="#FBBF24" stroke-width="2" stroke-opacity="0.38" fill="none"/><path d="M155.98,188C155.98,205.5 224.76,205.5 224.76,223L224.76,229" stroke="#FBBF24" stroke-width="2.2" fill="none" class="lighttd-flow"/><path class="pele-marker" d="M224.76,236L221.4,228L228.12,228Z" fill="#FBBF24" fill-opacity="0.88" stroke="none"/></g></g><g class="lighttd-packets"><circle r="3.8" fill="#38BDF8"><animateMotion dur="2.10s" begin="-0.20s" repeatCount="indefinite"><mpath href="#lighttd-edge-0"/></animateMotion></circle><circle r="3.8" fill="#818CF8"><animateMotion dur="2.32s" begin="-0.63s" repeatCount="indefinite"><mpath href="#lighttd-edge-1"/></animateMotion></circle><circle r="3.8" fill="#34D399"><animateMotion dur="2.54s" begin="-1.06s" repeatCount="indefinite"><mpath href="#lighttd-edge-2"/></animateMotion></circle><circle r="3.8" fill="#FBBF24"><animateMotion dur="2.76s" begin="-1.49s" repeatCount="indefinite"><mpath href="#lighttd-edge-3"/></animateMotion></circle></g><g class="pele-nodes"><g class="pele-node pele-shape-rect cyan" data-id="ui" transform="translate(71.99,41)"><rect x="-63.99" y="-33" width="127.98" height="66" rx="12" class="lighttd-card"/><rect x="-54.0" y="-20.0" width="5" height="40.0" rx="2.5" fill="#38BDF8"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.9">Web UI</tspan><tspan x="0" y="16.1">React · SSE</tspan></text></g><g class="pele-node pele-shape-stadium hub lighttd-hub-node" data-id="api" transform="translate(147.98,155)"><rect x="-79.9" y="-40.0" width="159.9" height="80.0" rx="24" fill="none" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="1.5" class="lighttd-pulse"/><rect x="-72.94" y="-33" width="145.88" height="66" rx="18" fill="url(#lighttd-hub-bg)" stroke="#38BDF8" stroke-opacity="0.65" stroke-width="1.6"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.9">API</tspan><tspan x="0" y="16.1">Node · Bun</tspan></text></g><g class="pele-node pele-shape-rect indigo" data-id="cli" transform="translate(223.97,41)"><rect x="-47.98" y="-33" width="95.97" height="66" rx="12" class="lighttd-card"/><rect x="-38.0" y="-20.0" width="5" height="40.0" rx="2.5" fill="#818CF8"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.9">CLI</tspan><tspan x="0" y="16.1">npx · CI</tspan></text></g><g class="pele-node pele-shape-rect emerald" data-id="db" transform="translate(71.2,269)"><rect x="-49.57" y="-33" width="99.14" height="66" rx="12" class="lighttd-card"/><rect x="-39.6" y="-20.0" width="5" height="40.0" rx="2.5" fill="#34D399"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.9">Postgres</tspan><tspan x="0" y="16.1">pgvector</tspan></text></g><g class="pele-node pele-shape-rect amber" data-id="queue" transform="translate(224.76,269)"><rect x="-63.98" y="-33" width="127.97" height="66" rx="12" class="lighttd-card"/><rect x="-54.0" y="-20.0" width="5" height="40.0" rx="2.5" fill="#FBBF24"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.9">Queue</tspan><tspan x="0" y="16.1">jobs · retries</tspan></text></g></g>
  </g>

  <rect x="61" y="410" width="300" height="30" rx="15" class="lighttd-card"/>
  <text x="210.5" y="429" text-anchor="middle" class="lighttd-footer">mmd-viz --theme light</text>
</svg>
