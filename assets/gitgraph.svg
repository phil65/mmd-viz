<svg xmlns="http://www.w3.org/2000/svg" class="gitgraph-root" viewBox="0 0 427 298" width="427" height="298" role="img" aria-label="gitGraph · history replays">
  <defs>
    <style>
      .gitgraph-root {
        --mv-bg: #070B14;
        --mv-card: #0F172A;
        --mv-border: rgba(148,163,184,0.24);
        --mv-fg: #F8FAFC;
        --mv-muted: #94A3B8;
        --mv-title: #38BDF8;
        --mv-dot: rgba(148,163,184,0.14);
        --mv-hub-start: #1E293B;
        --mv-hub-end: #0F172A;
        --pele-series-1: #38BDF8;
        --pele-series-2: #818CF8;
        --pele-series-3: #FBBF24;
        --pele-series-4: #34D399;
        --pele-series-5: #F472B6;
        --pele-series-6: #FB7185;
        --pele-series-7: #A78BFA;
        --pele-series-8: #2DD4BF;
      }
      .gitgraph-bg { fill: var(--mv-bg); }
      .gitgraph-card { fill: var(--mv-card); stroke: var(--mv-border); stroke-width: 1.2; }
      .gitgraph-dot { fill: var(--mv-dot); }
      .gitgraph-title { font: 700 13px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 2px; fill: var(--mv-title); text-transform: uppercase; }
      .gitgraph-footer { font: 500 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--mv-muted); }
      .gitgraph-stage { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; fill: var(--mv-fg); }
      .pele-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: var(--mv-fg); }
      .pele-label tspan:first-child { font-size: 14.5px; font-weight: 700; fill: var(--mv-fg); }
      .pele-label tspan:nth-child(n+2) { font-size: 11.5px; font-weight: 400; fill: var(--mv-muted); }
      .pele-cluster-label { font-size: 12px; font-weight: 600; letter-spacing: 0.04em; fill: var(--mv-muted); }
      .pele-edge-label rect { fill: var(--mv-card); stroke: var(--mv-border); stroke-width: 1; rx: 6; }
      .pele-edge-label text { font-size: 12px; font-weight: 600; fill: var(--mv-fg); }
      .pele-branch .pele-label { font-size: 12px; font-weight: 700; fill: #070B14; }
      .pele-task .pele-label { font-size: 12px; font-weight: 700; fill: var(--mv-fg); }
      .pele-task .pele-label[fill] { fill: #070B14; }
      .pele-commit-label text { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; fill: var(--mv-muted); }
      .gitgraph-hub-node .pele-label tspan:first-child { font-size: 16px; font-weight: 700; fill: var(--mv-fg); }
      .gitgraph-hub-node .pele-label tspan:nth-child(n+2) { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; fill: var(--mv-title); }
      .gitgraph-flow { stroke-dasharray: 6 14; stroke-linecap: round; animation: gitgraph-dash 1.80s linear infinite; }
      .gitgraph-pulse { transform-box: fill-box; transform-origin: center; animation: gitgraph-ring 3.20s ease-in-out infinite; }
      @keyframes gitgraph-dash { to { stroke-dashoffset: -40; } }
      @keyframes gitgraph-ring {
        0%, 100% { opacity: 0.25; transform: scale(0.97); }
        50% { opacity: 0.65; transform: scale(1.03); }
      }
      .gitgraph-flash { opacity: 0.15; animation: gitgraph-flash 4s linear infinite; }
      @keyframes gitgraph-flash { 0% { opacity: 0.15; } 6% { opacity: 0.95; } 22%, 100% { opacity: 0.15; } }
      .gitgraph-working > rect { animation: gitgraph-working 3.20s ease-in-out infinite; }
      @keyframes gitgraph-working { 50% { fill-opacity: 0.55; } }
      @media (prefers-reduced-motion: reduce) {
        .gitgraph-flow, .gitgraph-pulse, .gitgraph-flash, .gitgraph-working > rect { animation: none; }
        /* SMIL ignores the media query: what moves by it (packets, playhead, markers) goes */
        .gitgraph-packets, .gitgraph-smil { display: none; }
      }
    </style>
    <pattern id="gitgraph-dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" class="gitgraph-dot"/>
    </pattern>
    <radialGradient id="gitgraph-glow-l" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gitgraph-glow-r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gitgraph-hub-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--mv-hub-start)"/>
      <stop offset="100%" stop-color="var(--mv-hub-end)"/>
    </linearGradient>
  </defs>

  <rect width="427" height="298" rx="18" class="gitgraph-bg"/>
  <rect width="427" height="298" rx="18" fill="url(#gitgraph-dots)"/>
  <circle cx="111" cy="107" r="120" fill="url(#gitgraph-glow-l)"/>
  <circle cx="316" cy="191" r="120" fill="url(#gitgraph-glow-r)"/>
  <text x="213.5" y="42" text-anchor="middle" class="gitgraph-title">gitGraph · history replays</text>

  <g class="gitgraph-stage" transform="translate(52,76)" style="--_bg:var(--mv-bg);--_fg:var(--mv-fg);--_m:var(--mv-muted);--_l:#38BDF8;--_s:var(--mv-card);--_a:var(--mv-hub-start);--_b:var(--mv-border);--_c:#38BDF8;--_r:12px;--_w:700;--_hw:700;--_tw:700">
    <g transform="translate(74.34,20.5)"><g class="pele-branches" fill="none" font-size="14"><g class="pele-branch" data-id="main"><path class="pele-lane" d="M-20,0L240,0" stroke="var(--pele-series-1,#4c78a8)" stroke-dasharray="2 4"/><rect x="-66.34" y="-12.5" width="46.34" height="25" fill="var(--pele-series-1,#4c78a8)" style="rx:var(--_r)"/><text class="pele-label" fill="var(--_bg)" x="-43.17" y="4.9" text-anchor="middle">main</text></g><g class="pele-branch" data-id="feat"><path class="pele-lane" d="M-20,66.34L240,66.34" stroke="var(--pele-series-2,#f58518)" stroke-dasharray="2 4"/><rect x="-59.35" y="53.84" width="39.35" height="25" fill="var(--pele-series-2,#f58518)" style="rx:var(--_r)"/><text class="pele-label" fill="var(--_bg)" x="-39.68" y="71.24" text-anchor="middle">feat</text></g></g><g class="pele-edges" fill="none" stroke-width="2" stroke-linecap="round"><path id="gitgraph-edge-0" class="pele-edge" d="M0,0C18,0 18,66.34 36,66.34L44,66.34" stroke="#818CF8" stroke-opacity="0.45" stroke-width="2.2" fill="none" data-series="--pele-series-2"/><path d="M0,0C18,0 18,66.34 36,66.34L44,66.34" stroke="#818CF8" stroke-width="2.2" fill="none" class="gitgraph-flow"/><path id="gitgraph-edge-1" class="pele-edge pele-edge-merge" d="M88,66.34L140,66.34C158,66.34 158,0 176,0" stroke="#818CF8" stroke-opacity="0.45" stroke-width="2.2" fill="none" data-series="--pele-series-2"/><path d="M88,66.34L140,66.34C158,66.34 158,0 176,0" stroke="#818CF8" stroke-width="2.2" fill="none" class="gitgraph-flow"/><path id="gitgraph-edge-2" class="pele-edge" d="M44,66.34L88,66.34" stroke="#818CF8" stroke-opacity="0.45" stroke-width="2.2" fill="none" data-series="--pele-series-2"/><path d="M44,66.34L88,66.34" stroke="#818CF8" stroke-width="2.2" fill="none" class="gitgraph-flow"/><path id="gitgraph-edge-3" class="pele-edge" d="M0,0L132,0" stroke="#38BDF8" stroke-opacity="0.45" stroke-width="2.2" fill="none" data-series="--pele-series-1"/><path d="M0,0L132,0" stroke="#38BDF8" stroke-width="2.2" fill="none" class="gitgraph-flow"/><path id="gitgraph-edge-4" class="pele-edge" d="M132,0L176,0" stroke="#38BDF8" stroke-opacity="0.45" stroke-width="2.2" fill="none" data-series="--pele-series-1"/><path d="M132,0L176,0" stroke="#38BDF8" stroke-width="2.2" fill="none" class="gitgraph-flow"/><path id="gitgraph-edge-5" class="pele-edge" d="M176,0L220,0" stroke="#38BDF8" stroke-opacity="0.45" stroke-width="2.2" fill="none" data-series="--pele-series-1"/><path d="M176,0L220,0" stroke="#38BDF8" stroke-width="2.2" fill="none" class="gitgraph-flow"/></g><g class="gitgraph-packets"><circle r="3.4" fill="#818CF8"><animateMotion dur="6.90s" begin="-0.40s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.1467;1"><mpath href="#gitgraph-edge-0"/></animateMotion><animate attributeName="opacity" dur="6.90s" begin="-0.40s" repeatCount="indefinite" keyTimes="0;0.0200;0.1467;0.1867;1" values="1;1;1;0;0"/></circle><circle r="3.4" fill="#818CF8"><animateMotion dur="6.90s" begin="-0.40s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.1667;0.3133;1"><mpath href="#gitgraph-edge-1"/></animateMotion><animate attributeName="opacity" dur="6.90s" begin="-0.40s" repeatCount="indefinite" keyTimes="0;0.1667;0.1867;0.3133;0.3533;1" values="0;0;1;1;0;0"/></circle><circle r="3.4" fill="#818CF8"><animateMotion dur="6.90s" begin="-0.40s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.3333;0.4800;1"><mpath href="#gitgraph-edge-2"/></animateMotion><animate attributeName="opacity" dur="6.90s" begin="-0.40s" repeatCount="indefinite" keyTimes="0;0.3333;0.3533;0.4800;0.5200;1" values="0;0;1;1;0;0"/></circle><circle r="3.4" fill="#38BDF8"><animateMotion dur="6.90s" begin="-0.40s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.5000;0.6467;1"><mpath href="#gitgraph-edge-3"/></animateMotion><animate attributeName="opacity" dur="6.90s" begin="-0.40s" repeatCount="indefinite" keyTimes="0;0.5000;0.5200;0.6467;0.6867;1" values="0;0;1;1;0;0"/></circle><circle r="3.4" fill="#38BDF8"><animateMotion dur="6.90s" begin="-0.40s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.6667;0.8133;1"><mpath href="#gitgraph-edge-4"/></animateMotion><animate attributeName="opacity" dur="6.90s" begin="-0.40s" repeatCount="indefinite" keyTimes="0;0.6667;0.6867;0.8133;0.8533;1" values="0;0;1;1;0;0"/></circle><circle r="3.4" fill="#38BDF8"><animateMotion dur="6.90s" begin="-0.40s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.8333;0.9800;1"><mpath href="#gitgraph-edge-5"/></animateMotion><animate attributeName="opacity" dur="6.90s" begin="-0.40s" repeatCount="indefinite" keyTimes="0;0.8333;0.8533;0.9800;1.0000;1" values="0;0;1;1;0;0"/></circle></g><g class="pele-commits" font-size="12" fill="var(--_m)"><g class="pele-commit pele-commit-normal" data-id="init"><circle cx="0" cy="0" r="7" fill="var(--pele-series-1,#4c78a8)"/><circle cx="0" cy="0" r="11.5" fill="none" stroke="#38BDF8" stroke-width="1.6" class="gitgraph-flash" style="animation-duration:6.90s;animation-delay:-0.41s"/><g class="pele-commit-label" transform="rotate(-45 3 16.36)"><rect x="-14.34" y="9.36" width="19.34" height="14" rx="3" fill="var(--_bg)"/><text x="-4.67" y="20.56" text-anchor="middle">init</text></g></g><g class="pele-commit pele-commit-normal" data-id="themes"><circle cx="44" cy="66.34" r="7" fill="var(--pele-series-2,#f58518)"/><circle cx="44" cy="66.34" r="11.5" fill="none" stroke="#818CF8" stroke-width="1.6" class="gitgraph-flash" style="animation-duration:6.90s;animation-delay:0.20s"/><g class="pele-commit-label" transform="rotate(-45 47 82.71)"><rect x="5.65" y="75.71" width="43.35" height="14" rx="3" fill="var(--_bg)"/><text x="27.33" y="86.91" text-anchor="middle">themes</text></g></g><g class="pele-commit pele-commit-normal" data-id="sankey"><circle cx="88" cy="66.34" r="7" fill="var(--pele-series-2,#f58518)"/><circle cx="88" cy="66.34" r="11.5" fill="none" stroke="#818CF8" stroke-width="1.6" class="gitgraph-flash" style="animation-duration:6.90s;animation-delay:1.35s"/><g class="pele-commit-label" transform="rotate(-45 91 82.71)"><rect x="50.98" y="75.71" width="42.02" height="14" rx="3" fill="var(--_bg)"/><text x="71.99" y="86.91" text-anchor="middle">sankey</text></g></g><g class="pele-commit pele-commit-normal" data-id="fix"><circle cx="132" cy="0" r="7" fill="var(--pele-series-1,#4c78a8)"/><circle cx="132" cy="0" r="11.5" fill="none" stroke="#38BDF8" stroke-width="1.6" class="gitgraph-flash" style="animation-duration:6.90s;animation-delay:2.50s"/><g class="pele-commit-label" transform="rotate(-45 135 16.36)"><rect x="121" y="9.36" width="16" height="14" rx="3" fill="var(--_bg)"/><text x="129" y="20.56" text-anchor="middle">fix</text></g></g><g class="pele-commit pele-commit-merge" data-id="v0.6.0"><circle cx="176" cy="0" r="6" fill="var(--_bg)" stroke="var(--pele-series-1,#4c78a8)" stroke-width="2"/><circle cx="176" cy="0" r="10.5" fill="none" stroke="#38BDF8" stroke-width="1.6" class="gitgraph-flash" style="animation-duration:6.90s;animation-delay:3.65s"/><circle cx="176" cy="0" r="2.5" fill="var(--pele-series-1,#4c78a8)"/><g class="pele-commit-label" transform="rotate(-45 179 16.36)"><rect x="144.31" y="9.36" width="36.69" height="14" rx="3" fill="var(--_bg)"/><text x="162.66" y="20.56" text-anchor="middle">v0.6.0</text></g></g><g class="pele-commit pele-commit-normal" data-id="docs"><circle cx="220" cy="0" r="7" fill="var(--pele-series-1,#4c78a8)"/><circle cx="220" cy="0" r="11.5" fill="none" stroke="#38BDF8" stroke-width="1.6" class="gitgraph-flash" style="animation-duration:6.90s;animation-delay:4.80s"/><g class="pele-commit-label" transform="rotate(-45 223 16.36)"><rect x="195.66" y="9.36" width="29.34" height="14" rx="3" fill="var(--_bg)"/><text x="210.33" y="20.56" text-anchor="middle">docs</text></g></g></g></g>
  </g>

  <rect x="34" y="246" width="360" height="30" rx="15" class="gitgraph-card"/>
  <text x="213.5" y="265" text-anchor="middle" class="gitgraph-footer">commits flash as the replay reaches them</text>
</svg>
