<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mmd-viz — Mermaid to Animated SVG Playground</title>
    <style>
      :root {
        --bg: #070b14;
        --panel: #0f172a;
        --border: rgba(148, 163, 184, 0.2);
        --fg: #f8fafc;
        --muted: #94a3b8;
        --accent: #38bdf8;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
        padding: 12px 18px;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
      }
      .brand {
        font-weight: 800;
        font-size: 16px;
        letter-spacing: -0.02em;
        color: var(--accent);
        margin-right: 8px;
        text-decoration: none;
      }
      select, input[type="text"], button {
        background: #1e293b;
        color: var(--fg);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 6px 10px;
        font-size: 13px;
        font-family: inherit;
      }
      button {
        cursor: pointer;
        font-weight: 600;
        transition: border-color 0.15s, background 0.15s;
      }
      button:hover { border-color: var(--accent); background: #26354d; }
      button.primary {
        background: var(--accent);
        color: #070b14;
        border-color: var(--accent);
      }
      button.primary:hover { background: #7dd3fc; }
      label.chk {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 13px;
        color: var(--muted);
        cursor: pointer;
      }
      .spacer { flex: 1; }
      main {
        flex: 1;
        display: grid;
        grid-template-columns: minmax(320px, 42%) 1fr;
        min-height: 0;
      }
      @media (max-width: 860px) {
        main { grid-template-columns: 1fr; grid-template-rows: 45% 1fr; }
      }
      .editor-pane {
        display: flex;
        flex-direction: column;
        border-right: 1px solid var(--border);
        min-height: 0;
      }
      .meta-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        padding: 10px 12px;
        border-bottom: 1px solid var(--border);
        background: rgba(15, 23, 42, 0.6);
      }
      #stepper { display: inline-flex; gap: 6px; align-items: center; }
      #stepper[hidden] { display: none; }
      #stepper button { padding: 2px 8px; }
      textarea {
        flex: 1;
        width: 100%;
        resize: none;
        border: none;
        outline: none;
        padding: 14px;
        background: #0b1120;
        color: #e2e8f0;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 13.5px;
        line-height: 1.55;
      }
      .preview-pane {
        display: flex;
        flex-direction: column;
        min-height: 0;
        position: relative;
      }
      .preview-stage {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        overflow: auto;
        background-image: radial-gradient(rgba(148, 163, 184, 0.12) 1px, transparent 1px);
        background-size: 20px 20px;
      }
      .preview-stage svg {
        max-width: 100%;
        height: auto;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
        border-radius: 18px;
      }
      .status-bar {
        display: flex;
        justify-content: space-between;
        padding: 7px 14px;
        font-size: 12px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        color: var(--muted);
        background: var(--panel);
        border-top: 1px solid var(--border);
      }
      .error {
        color: #fb7185;
        background: rgba(251, 113, 133, 0.1);
        border: 1px solid rgba(251, 113, 133, 0.35);
        padding: 14px 18px;
        border-radius: 12px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 13px;
        white-space: pre-wrap;
        max-width: 600px;
      }
    </style>
  </head>
  <body>
    <header>
      <a class="brand" href="https://github.com/phil65/mmd-viz" target="_blank" rel="noreferrer">mmd-viz</a>
      <select id="preset" title="Preset example"></select>
      <select id="theme" title="Color theme"></select>
      <label class="chk">
        Speed
        <select id="speed">
          <option value="0.5">0.5x</option>
          <option value="1" selected>1x</option>
          <option value="1.5">1.5x</option>
          <option value="2">2x</option>
        </select>
      </label>
      <label class="chk"><input type="checkbox" id="animate" checked /> Animate</label>
      <label class="chk"><input type="checkbox" id="transparent" /> Transparent</label>
      <div class="spacer"></div>
      <button id="copyBtn">Copy SVG</button>
      <button id="downloadBtn" class="primary">Download SVG</button>
    </header>

    <main>
      <section class="editor-pane">
        <div class="meta-row">
          <input type="text" id="titleInput" placeholder="Header title (optional)" />
          <input type="text" id="footerInput" placeholder="Footer pill (optional)" />
        </div>
        <textarea id="source" spellcheck="false"></textarea>
      </section>

      <section class="preview-pane">
        <div class="preview-stage" id="preview"></div>
        <div class="status-bar">
          <span id="stats">Ready</span>
          <span id="stepper" hidden>
            <button id="prevStep" title="Previous step (←)">◀</button>
            <span id="stepLabel"></span>
            <button id="nextStep" title="Next step (→)">▶</button>
            <button id="resetStep" title="Show all (Esc)">All</button>
          </span>
          <label class="chk" id="labelsChk" hidden title="labels: &quot;focus&quot;, keepLabels: &quot;.frontier&quot;"
            ><input type="checkbox" id="focusLabels" checked /> Labels on hover <span id="focusName"></span
          ></label>
          <span>Zero-JS SVG · hover to highlight (mmd-viz/interactive)</span>
        </div>
      </section>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
