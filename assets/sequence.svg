<svg xmlns="http://www.w3.org/2000/svg" class="sequence-root" viewBox="0 0 463 430" width="463" height="430" role="img" aria-label="Sequence diagram · chronological relay">
  <defs>
    <style>
      .sequence-root {
        --mv-bg: #070B14;
        --mv-card: #0F172A;
        --mv-border: rgba(148,163,184,0.24);
        --mv-fg: #F8FAFC;
        --mv-muted: #94A3B8;
        --mv-title: #38BDF8;
        --mv-dot: rgba(148,163,184,0.14);
        --mv-hub-start: #1E293B;
        --mv-hub-end: #0F172A;
        --pele-series-1: #38BDF8;
        --pele-series-2: #818CF8;
        --pele-series-3: #FBBF24;
        --pele-series-4: #34D399;
        --pele-series-5: #F472B6;
        --pele-series-6: #FB7185;
        --pele-series-7: #A78BFA;
        --pele-series-8: #2DD4BF;
      }
      .sequence-bg { fill: var(--mv-bg); }
      .sequence-card { fill: var(--mv-card); stroke: var(--mv-border); stroke-width: 1.2; }
      .sequence-dot { fill: var(--mv-dot); }
      .sequence-title { font: 700 13px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 2px; fill: var(--mv-title); text-transform: uppercase; }
      .sequence-footer { font: 500 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--mv-muted); }
      .sequence-stage { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; fill: var(--mv-fg); }
      .pele-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: var(--mv-fg); }
      .pele-label tspan:first-child { font-size: 14.5px; font-weight: 700; fill: var(--mv-fg); }
      .pele-label tspan:nth-child(n+2) { font-size: 11.5px; font-weight: 400; fill: var(--mv-muted); }
      .pele-cluster-label { font-size: 12px; font-weight: 600; letter-spacing: 0.04em; fill: var(--mv-muted); }
      .pele-edge-label rect { fill: var(--mv-card); stroke: var(--mv-border); stroke-width: 1; rx: 6; }
      .pele-edge-label text { font-size: 12px; font-weight: 600; fill: var(--mv-fg); }
      .pele-branch .pele-label { font-size: 12px; font-weight: 700; fill: #070B14; }
      .pele-task .pele-label { font-size: 12px; font-weight: 700; fill: var(--mv-fg); }
      .pele-task .pele-label[fill] { fill: #070B14; }
      .pele-commit-label text { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; fill: var(--mv-muted); }
      .sequence-hub-node .pele-label tspan:first-child { font-size: 16px; font-weight: 700; fill: var(--mv-fg); }
      .sequence-hub-node .pele-label tspan:nth-child(n+2) { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; fill: var(--mv-title); }
      .sequence-flow { stroke-dasharray: 6 14; stroke-linecap: round; animation: sequence-dash 1.80s linear infinite; }
      .sequence-pulse { transform-box: fill-box; transform-origin: center; animation: sequence-ring 3.20s ease-in-out infinite; }
      @keyframes sequence-dash { to { stroke-dashoffset: -40; } }
      @keyframes sequence-ring {
        0%, 100% { opacity: 0.25; transform: scale(0.97); }
        50% { opacity: 0.65; transform: scale(1.03); }
      }
      .sequence-flash { opacity: 0.15; animation: sequence-flash 4s linear infinite; }
      @keyframes sequence-flash { 0% { opacity: 0.15; } 6% { opacity: 0.95; } 22%, 100% { opacity: 0.15; } }
      .sequence-working > rect { animation: sequence-working 3.20s ease-in-out infinite; }
      @keyframes sequence-working { 50% { fill-opacity: 0.55; } }
      @media (prefers-reduced-motion: reduce) {
        .sequence-flow, .sequence-pulse, .sequence-flash, .sequence-working > rect { animation: none; }
        /* SMIL ignores the media query: what moves by it (packets, playhead, markers) goes */
        .sequence-packets, .sequence-smil { display: none; }
      }
    </style>
    <pattern id="sequence-dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" class="sequence-dot"/>
    </pattern>
    <radialGradient id="sequence-glow-l" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sequence-glow-r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sequence-hub-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--mv-hub-start)"/>
      <stop offset="100%" stop-color="var(--mv-hub-end)"/>
    </linearGradient>
  </defs>

  <rect width="463" height="430" rx="18" class="sequence-bg"/>
  <rect width="463" height="430" rx="18" fill="url(#sequence-dots)"/>
  <circle cx="120" cy="155" r="130" fill="url(#sequence-glow-l)"/>
  <circle cx="343" cy="275" r="130" fill="url(#sequence-glow-r)"/>
  <text x="231.5" y="42" text-anchor="middle" class="sequence-title">Sequence diagram · chronological relay</text>

  <g class="sequence-stage" transform="translate(52,76)" style="--_bg:var(--mv-bg);--_fg:var(--mv-fg);--_m:var(--mv-muted);--_l:#38BDF8;--_s:var(--mv-card);--_a:var(--mv-hub-start);--_b:var(--mv-border);--_c:#38BDF8;--_r:12px;--_w:700;--_hw:700;--_tw:700">
    <g transform="translate(44.9,8)"><g class="pele-lifelines" fill="none" stroke="var(--_b)"><path class="pele-lifeline" data-id="IDE" d="M0,44V218"/><path class="pele-lifeline" data-id="AP" d="M128.92,44V218"/><path class="pele-lifeline" data-id="LLM" d="M267.58,44V218"/></g><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge pele-message" data-id="i0"><path id="sequence-edge-0" d="M0,87H121.92" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.8" fill="none"/><path class="pele-marker" d="M128.92,87L120.92,90.36L120.92,83.64Z" fill="#38BDF8" fill-opacity="0.88" stroke="none"/></g><g class="pele-edge pele-message" data-id="i1"><path id="sequence-edge-1" d="M128.92,124H260.58" stroke="#818CF8" stroke-width="2" stroke-opacity="0.8" fill="none"/><path class="pele-marker" d="M267.58,124L259.58,127.36L259.58,120.64Z" fill="#818CF8" fill-opacity="0.88" stroke="none"/></g><g class="pele-edge pele-message" data-id="i2"><path id="sequence-edge-2" d="M267.58,161H135.92" stroke="#FBBF24" stroke-width="2" stroke-opacity="0.8" stroke-dasharray="5 5" fill="none"/><path class="pele-marker" d="M128.92,161L136.92,157.64L136.92,164.36Z" fill="#FBBF24" fill-opacity="0.88" stroke="none"/></g><g class="pele-edge pele-message" data-id="i3"><path id="sequence-edge-3" d="M128.92,198H7" stroke="#34D399" stroke-width="2" stroke-opacity="0.8" stroke-dasharray="5 5" fill="none"/><path class="pele-marker" d="M0,198L8,194.64L8,201.36Z" fill="#34D399" fill-opacity="0.88" stroke="none"/></g></g><g class="sequence-packets"><circle r="4" fill="#38BDF8"><animateMotion dur="4.60s" begin="-0.40s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.2200;1"><mpath href="#sequence-edge-0"/></animateMotion><animate attributeName="opacity" dur="4.60s" begin="-0.40s" repeatCount="indefinite" keyTimes="0;0.0200;0.2200;0.2600;1" values="1;1;1;0;0"/></circle><circle r="4" fill="#818CF8"><animateMotion dur="4.60s" begin="-0.40s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.2500;0.4700;1"><mpath href="#sequence-edge-1"/></animateMotion><animate attributeName="opacity" dur="4.60s" begin="-0.40s" repeatCount="indefinite" keyTimes="0;0.2500;0.2700;0.4700;0.5100;1" values="0;0;1;1;0;0"/></circle><circle r="4" fill="#FBBF24"><animateMotion dur="4.60s" begin="-0.40s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.5000;0.7200;1"><mpath href="#sequence-edge-2"/></animateMotion><animate attributeName="opacity" dur="4.60s" begin="-0.40s" repeatCount="indefinite" keyTimes="0;0.5000;0.5200;0.7200;0.7600;1" values="0;0;1;1;0;0"/></circle><circle r="4" fill="#34D399"><animateMotion dur="4.60s" begin="-0.40s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.7500;0.9700;1"><mpath href="#sequence-edge-3"/></animateMotion><animate attributeName="opacity" dur="4.60s" begin="-0.40s" repeatCount="indefinite" keyTimes="0;0.7500;0.7700;0.9700;1.0000;1" values="0;0;1;1;0;0"/></circle></g><g class="pele-edge-labels" font-size="14"><g class="pele-edge-label" data-id="i0"><text x="64.46" y="77.4" text-anchor="middle">session/prompt</text></g><g class="pele-edge-label" data-id="i1"><text x="198.25" y="114.4" text-anchor="middle">stream request</text></g><g class="pele-edge-label" data-id="i2"><text x="198.25" y="151.4" text-anchor="middle">tool_call + deltas</text></g><g class="pele-edge-label" data-id="i3"><text x="64.46" y="188.4" text-anchor="middle">session/update</text></g></g><g class="pele-nodes"><g class="pele-node pele-actor pele-actor-participant pele-actor-footer" data-id="IDE"><rect x="-36.9" y="218" width="73.79" height="44" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="245.6" text-anchor="middle">Editor</text></g><g class="pele-node pele-actor pele-actor-participant pele-actor-footer" data-id="AP"><rect x="92.02" y="218" width="73.81" height="44" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="128.92" y="245.6" text-anchor="middle">Agent</text></g><g class="pele-node pele-actor pele-actor-participant pele-actor-footer" data-id="LLM"><rect x="229.8" y="218" width="75.57" height="44" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="267.58" y="245.6" text-anchor="middle">Model</text></g><g class="pele-node pele-actor pele-actor-participant" data-id="IDE"><rect x="-36.9" y="0" width="73.79" height="44" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="27.6" text-anchor="middle">Editor</text></g><g class="pele-node pele-actor pele-actor-participant" data-id="AP"><rect x="92.02" y="0" width="73.81" height="44" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="128.92" y="27.6" text-anchor="middle">Agent</text></g><g class="pele-node pele-actor pele-actor-participant" data-id="LLM"><rect x="229.8" y="0" width="75.57" height="44" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="267.58" y="27.6" text-anchor="middle">Model</text></g></g></g>
  </g>

  <rect x="52" y="378" width="360" height="30" rx="15" class="sequence-card"/>
  <text x="231.5" y="397" text-anchor="middle" class="sequence-footer">messages fire in order: 1 -&gt; 2 -&gt; 3 -&gt; 4</text>
</svg>
