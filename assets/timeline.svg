<svg xmlns="http://www.w3.org/2000/svg" class="timeline-root" viewBox="0 0 708 330" width="708" height="330" role="img" aria-label="Timeline · axis &amp; milestones">
  <defs>
    <style>
      .timeline-root {
        --mv-bg: #070B14;
        --mv-card: #0F172A;
        --mv-border: rgba(148,163,184,0.24);
        --mv-fg: #F8FAFC;
        --mv-muted: #94A3B8;
        --mv-title: #38BDF8;
        --mv-dot: rgba(148,163,184,0.14);
        --mv-hub-start: #1E293B;
        --mv-hub-end: #0F172A;
        --pele-series-1: #38BDF8;
        --pele-series-2: #818CF8;
        --pele-series-3: #FBBF24;
        --pele-series-4: #34D399;
        --pele-series-5: #F472B6;
        --pele-series-6: #FB7185;
        --pele-series-7: #A78BFA;
        --pele-series-8: #2DD4BF;
      }
      .timeline-bg { fill: var(--mv-bg); }
      .timeline-card { fill: var(--mv-card); stroke: var(--mv-border); stroke-width: 1.2; }
      .timeline-dot { fill: var(--mv-dot); }
      .timeline-title { font: 700 13px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 2px; fill: var(--mv-title); text-transform: uppercase; }
      .timeline-footer { font: 500 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--mv-muted); }
      .timeline-stage { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; fill: var(--mv-fg); }
      .pele-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: var(--mv-fg); }
      .pele-label tspan:first-child { font-size: 14.5px; font-weight: 700; fill: var(--mv-fg); }
      .pele-label tspan:nth-child(n+2) { font-size: 11.5px; font-weight: 400; fill: var(--mv-muted); }
      .pele-cluster-label { font-size: 12px; font-weight: 600; letter-spacing: 0.04em; fill: var(--mv-muted); }
      .pele-edge-label rect { fill: var(--mv-card); stroke: var(--mv-border); stroke-width: 1; rx: 6; }
      .pele-edge-label text { font-size: 12px; font-weight: 600; fill: var(--mv-fg); }
      .pele-branch .pele-label { font-size: 12px; font-weight: 700; fill: #070B14; }
      .pele-task .pele-label { font-size: 12px; font-weight: 700; fill: var(--mv-fg); }
      .pele-task .pele-label[fill] { fill: #070B14; }
      .pele-commit-label text { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; fill: var(--mv-muted); }
      .timeline-hub-node .pele-label tspan:first-child { font-size: 16px; font-weight: 700; fill: var(--mv-fg); }
      .timeline-hub-node .pele-label tspan:nth-child(n+2) { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; fill: var(--mv-title); }
      .timeline-flow { stroke-dasharray: 6 14; stroke-linecap: round; animation: timeline-dash 1.80s linear infinite; }
      .timeline-pulse { transform-box: fill-box; transform-origin: center; animation: timeline-ring 3.20s ease-in-out infinite; }
      @keyframes timeline-dash { to { stroke-dashoffset: -40; } }
      @keyframes timeline-ring {
        0%, 100% { opacity: 0.25; transform: scale(0.97); }
        50% { opacity: 0.65; transform: scale(1.03); }
      }
      .timeline-flash { opacity: 0.15; animation: timeline-flash 4s linear infinite; }
      @keyframes timeline-flash { 0% { opacity: 0.15; } 6% { opacity: 0.95; } 22%, 100% { opacity: 0.15; } }
      .timeline-working > rect { animation: timeline-working 3.20s ease-in-out infinite; }
      @keyframes timeline-working { 50% { fill-opacity: 0.55; } }
      @media (prefers-reduced-motion: reduce) {
        .timeline-flow, .timeline-pulse, .timeline-flash, .timeline-working > rect { animation: none; }
        /* SMIL ignores the media query: what moves by it (packets, playhead, markers) goes */
        .timeline-packets, .timeline-smil { display: none; }
      }
      .timeline-panel-frame { fill: var(--mv-card); fill-opacity: 0.72; stroke: var(--timeline-accent); stroke-opacity: 0.38; stroke-width: 1.2; }
      .pele-cluster-label.timeline-panel-label { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
      .pele-label.mv-chip-label { font-size: 13px; font-weight: 500; fill: var(--mv-fg); }
      .timeline-period-card { fill: var(--mv-card); stroke-opacity: 0.4; stroke-width: 1.2; }
      .pele-event text { font-size: 13px; fill: var(--mv-fg); }
      .pele-section .pele-period > rect { fill: var(--mv-card); stroke-width: 1.4; }
      .pele-section .pele-period > text { font-weight: 600; fill: var(--mv-fg); }
    </style>
    <pattern id="timeline-dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" class="timeline-dot"/>
    </pattern>
    <radialGradient id="timeline-glow-l" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="timeline-glow-r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="timeline-hub-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--mv-hub-start)"/>
      <stop offset="100%" stop-color="var(--mv-hub-end)"/>
    </linearGradient>
  </defs>

  <rect width="708" height="330" rx="18" class="timeline-bg"/>
  <rect width="708" height="330" rx="18" fill="url(#timeline-dots)"/>
  <circle cx="184" cy="119" r="198" fill="url(#timeline-glow-l)"/>
  <circle cx="524" cy="211" r="198" fill="url(#timeline-glow-r)"/>
  <text x="354" y="42" text-anchor="middle" class="timeline-title">Timeline · axis &amp; milestones</text>

  <g class="timeline-stage" transform="translate(52,76)" style="--_bg:var(--mv-bg);--_fg:var(--mv-fg);--_m:var(--mv-muted);--_l:#38BDF8;--_s:var(--mv-card);--_a:var(--mv-hub-start);--_b:var(--mv-border);--_c:#38BDF8;--_r:12px;--_w:700;--_hw:700;--_tw:700">
    <path id="timeline-axis" class="pele-axis" d="M8,68H589" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="2" fill="none"/><path d="M8,68H589" stroke="#38BDF8" stroke-width="2.2" fill="none" class="timeline-flow"/><path class="pele-marker" d="M596,68L588,71.36L588,64.64Z" fill="var(--_l)" stroke="none"/><g class="pele-node pele-period" data-id="2024"><rect x="8" y="8" width="176" height="40" fill="var(--pele-series-1,#4c78a8)" style="rx:var(--_r)" stroke="var(--pele-series-1,#4c78a8)"/><text fill="#070B14" x="96" y="33.6" text-anchor="middle">2024</text><path class="pele-edge" d="M96,48V88" fill="none" stroke="var(--_b)"/><circle class="pele-dot" cx="96" cy="68" r="4" fill="var(--pele-series-1,#4c78a8)" stroke="var(--_bg)" stroke-width="2"/><circle cx="96" cy="68" r="8.5" fill="none" stroke="var(--pele-series-1,#4c78a8)" stroke-width="1.4" class="timeline-pulse" style="animation-delay:-0.00s"/><rect x="8" y="88" width="176" height="37" rx="12" class="timeline-period-card" style="stroke:var(--pele-series-1,#4c78a8)"/><rect x="22" y="87" width="24" height="3" rx="1.5" fill="var(--pele-series-1,#4c78a8)"/><g class="pele-node pele-event"><circle cx="19" cy="106.9" r="3" fill="var(--pele-series-1,#4c78a8)"/><text font-size="14" x="29" y="111.4" text-anchor="start">Prototype</text></g></g><g class="pele-node pele-period" data-id="2025"><rect x="204" y="8" width="176" height="40" fill="var(--pele-series-2,#f58518)" style="rx:var(--_r)" stroke="var(--pele-series-2,#f58518)"/><text fill="#070B14" x="292" y="33.6" text-anchor="middle">2025</text><path class="pele-edge" d="M292,48V88" fill="none" stroke="var(--_b)"/><circle class="pele-dot" cx="292" cy="68" r="4" fill="var(--pele-series-2,#f58518)" stroke="var(--_bg)" stroke-width="2"/><circle cx="292" cy="68" r="8.5" fill="none" stroke="var(--pele-series-2,#f58518)" stroke-width="1.4" class="timeline-pulse" style="animation-delay:-0.45s"/><rect x="204" y="88" width="176" height="82" rx="12" class="timeline-period-card" style="stroke:var(--pele-series-2,#f58518)"/><rect x="218" y="87" width="24" height="3" rx="1.5" fill="var(--pele-series-2,#f58518)"/><g class="pele-node pele-event"><circle cx="215" cy="106.9" r="3" fill="var(--pele-series-2,#f58518)"/><text font-size="14" x="225" y="111.4" text-anchor="start">Animated flowcharts</text></g><g class="pele-node pele-event"><circle cx="215" cy="151.9" r="3" fill="var(--pele-series-2,#f58518)"/><text font-size="14" x="225" y="156.4" text-anchor="start">Sequence relay</text></g></g><g class="pele-node pele-period" data-id="2026"><rect x="400" y="8" width="176" height="40" fill="var(--pele-series-3,#54a24b)" style="rx:var(--_r)" stroke="var(--pele-series-3,#54a24b)"/><text fill="#070B14" x="488" y="33.6" text-anchor="middle">2026</text><path class="pele-edge" d="M488,48V88" fill="none" stroke="var(--_b)"/><circle class="pele-dot" cx="488" cy="68" r="4" fill="var(--pele-series-3,#54a24b)" stroke="var(--_bg)" stroke-width="2"/><circle cx="488" cy="68" r="8.5" fill="none" stroke="var(--pele-series-3,#54a24b)" stroke-width="1.4" class="timeline-pulse" style="animation-delay:-0.90s"/><rect x="400" y="88" width="176" height="82" rx="12" class="timeline-period-card" style="stroke:var(--pele-series-3,#54a24b)"/><rect x="414" y="87" width="24" height="3" rx="1.5" fill="var(--pele-series-3,#54a24b)"/><g class="pele-node pele-event"><circle cx="411" cy="106.9" r="3" fill="var(--pele-series-3,#54a24b)"/><text font-size="14" x="421" y="111.4" text-anchor="start">Every diagram type</text></g><g class="pele-node pele-event"><circle cx="411" cy="151.9" r="3" fill="var(--pele-series-3,#54a24b)"/><text font-size="14" x="421" y="156.4" text-anchor="start">Interactive &amp; foldable</text></g></g><g class="timeline-packets"><circle r="4.2" fill="#38BDF8"><animateMotion dur="3.20s" begin="-0.90s" repeatCount="indefinite"><mpath href="#timeline-axis"/></animateMotion></circle></g>
  </g>

  <rect x="204" y="278" width="300" height="30" rx="15" class="timeline-card"/>
  <text x="354" y="297" text-anchor="middle" class="timeline-footer">a pulse travels the axis</text>
</svg>
