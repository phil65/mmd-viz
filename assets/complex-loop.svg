<svg xmlns="http://www.w3.org/2000/svg" class="complexloop-root" viewBox="0 0 1083 326" width="1083" height="326" role="img" aria-label="Agentic loop · subgraphs + labels + feedback">
  <defs>
    <style>
      .complexloop-root {
        --mv-bg: #070B14;
        --mv-card: #0F172A;
        --mv-border: rgba(148,163,184,0.24);
        --mv-fg: #F8FAFC;
        --mv-muted: #94A3B8;
        --mv-title: #38BDF8;
        --mv-dot: rgba(148,163,184,0.14);
        --mv-hub-start: #1E293B;
        --mv-hub-end: #0F172A;
        --pele-series-1: #38BDF8;
        --pele-series-2: #818CF8;
        --pele-series-3: #FBBF24;
        --pele-series-4: #34D399;
        --pele-series-5: #F472B6;
      }
      .complexloop-bg { fill: var(--mv-bg); }
      .complexloop-card { fill: var(--mv-card); stroke: var(--mv-border); stroke-width: 1.2; }
      .complexloop-dot { fill: var(--mv-dot); }
      .complexloop-title { font: 700 13px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 2px; fill: var(--mv-title); text-transform: uppercase; }
      .complexloop-footer { font: 500 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--mv-muted); }
      .complexloop-stage { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; fill: var(--mv-fg); }
      .pele-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: var(--mv-fg); }
      .pele-label tspan:first-child { font-size: 14.5px; font-weight: 700; fill: var(--mv-fg); }
      .pele-label tspan:nth-child(n+2) { font-size: 11.5px; font-weight: 400; fill: var(--mv-muted); }
      .pele-cluster-label { font-size: 12px; font-weight: 600; letter-spacing: 0.04em; fill: var(--mv-muted); }
      .pele-edge-label rect { fill: var(--mv-card); stroke: var(--mv-border); stroke-width: 1; rx: 6; }
      .pele-edge-label text { font-size: 12px; font-weight: 600; fill: var(--mv-fg); }
      .pele-branch .pele-label { font-size: 12px; font-weight: 700; fill: #070B14; }
      .pele-task .pele-label { font-size: 12px; font-weight: 700; fill: var(--mv-fg); }
      .pele-task .pele-label[fill] { fill: #070B14; }
      .pele-commit-label text { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; fill: var(--mv-muted); }
      .complexloop-hub-node .pele-label tspan:first-child { font-size: 16px; font-weight: 700; fill: var(--mv-fg); }
      .complexloop-hub-node .pele-label tspan:nth-child(2) { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; fill: var(--mv-title); }
      .complexloop-flow { stroke-dasharray: 6 14; stroke-linecap: round; animation: complexloop-dash 1.80s linear infinite; }
      .complexloop-pulse { transform-box: fill-box; transform-origin: center; animation: complexloop-ring 3.20s ease-in-out infinite; }
      @keyframes complexloop-dash { to { stroke-dashoffset: -40; } }
      @keyframes complexloop-ring {
        0%, 100% { opacity: 0.25; transform: scale(0.97); }
        50% { opacity: 0.65; transform: scale(1.03); }
      }
      .complexloop-flash { opacity: 0.15; animation: complexloop-flash 4s linear infinite; }
      @keyframes complexloop-flash { 0% { opacity: 0.15; } 6% { opacity: 0.95; } 22%, 100% { opacity: 0.15; } }
      .complexloop-working > rect { animation: complexloop-working 3.20s ease-in-out infinite; }
      @keyframes complexloop-working { 50% { fill-opacity: 0.55; } }
      @media (prefers-reduced-motion: reduce) {
        .complexloop-flow, .complexloop-pulse, .complexloop-flash, .complexloop-working > rect { animation: none; }
        /* SMIL ignores the media query: what moves by it (packets, playhead, markers) goes */
        .complexloop-packets, .complexloop-smil { display: none; }
      }
    </style>
    <pattern id="complexloop-dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" class="complexloop-dot"/>
    </pattern>
    <radialGradient id="complexloop-glow-l" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="complexloop-glow-r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="complexloop-hub-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--mv-hub-start)"/>
      <stop offset="100%" stop-color="var(--mv-hub-end)"/>
    </linearGradient>
  </defs>

  <rect width="1083" height="326" rx="18" class="complexloop-bg"/>
  <rect width="1083" height="326" rx="18" fill="url(#complexloop-dots)"/>
  <circle cx="282" cy="117" r="303" fill="url(#complexloop-glow-l)"/>
  <circle cx="801" cy="209" r="303" fill="url(#complexloop-glow-r)"/>
  <text x="541.5" y="42" text-anchor="middle" class="complexloop-title">Agentic loop · subgraphs + labels + feedback</text>

  <g class="complexloop-stage" transform="translate(52,76)" style="--_bg:var(--mv-bg);--_fg:var(--mv-fg);--_m:var(--mv-muted);--_l:#38BDF8;--_s:var(--mv-card);--_a:var(--mv-hub-start);--_b:var(--mv-border);--_c:#38BDF8;--_r:12px;--_w:700;--_hw:700;--_tw:700">
    <g class="pele-clusters"><g class="pele-cluster" data-id="work"><rect x="419.15" y="8" width="377.02" height="157.95" fill="var(--_a)" fill-opacity="0.5" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-cluster-label" fill="var(--_m)" x="468.28" y="33.6" text-anchor="middle">Execution</text></g><g class="pele-cluster" data-id="intake"><rect x="8" y="34" width="323.15" height="108" fill="var(--_a)" fill-opacity="0.5" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-cluster-label" fill="var(--_m)" x="43.79" y="59.6" text-anchor="middle">Intake</text></g></g><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge" data-id="L_prompt_plan_0"><path id="complexloop-edge-0" d="M152.02,98L193.02,98" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.32" fill="none"/><path d="M152.02,98L193.02,98" stroke="#38BDF8" stroke-width="2.2" fill="none" class="complexloop-flow"/><path class="pele-marker" d="M200.02,98L192.02,101.36L192.02,94.64Z" fill="#38BDF8" fill-opacity="0.88" stroke="none"/></g><g class="pele-edge" data-id="L_plan_tool_0"><path id="complexloop-edge-1" d="M291.15,90L331.15,90C375.15,90 375.15,72 419.15,72L452.15,72" stroke="#818CF8" stroke-width="2" stroke-opacity="0.32" fill="none"/><path d="M291.15,90L331.15,90C375.15,90 375.15,72 419.15,72L452.15,72" stroke="#818CF8" stroke-width="2.2" fill="none" class="complexloop-flow"/><path class="pele-marker" d="M459.15,72L451.15,75.36L451.15,68.64Z" fill="#818CF8" fill-opacity="0.88" stroke="none"/></g><g class="pele-edge" data-id="L_tool_check_0"><path id="complexloop-edge-2" d="M554.72,72L637.32,72" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.32" fill="none"/><path d="M554.72,72L637.32,72" stroke="#38BDF8" stroke-width="2.2" fill="none" class="complexloop-flow"/><path class="pele-marker" d="M644.32,72L636.32,75.36L636.32,68.64Z" fill="#38BDF8" fill-opacity="0.88" stroke="none"/></g><g class="pele-edge" data-id="L_check_done_0"><path id="complexloop-edge-3" d="M756.18,98L870.96,98" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.32" fill="none"/><path d="M756.18,98L870.96,98" stroke="#38BDF8" stroke-width="2.2" fill="none" class="complexloop-flow"/><path class="pele-marker" d="M877.96,98L869.96,101.36L869.96,94.64Z" fill="#38BDF8" fill-opacity="0.88" stroke="none"/></g><g class="pele-edge" data-id="L_check_plan_0"><path id="complexloop-edge-4" d="M644.32,124L358.65,124C344.9,124 344.9,106 331.15,106L298.15,106" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.32" stroke-dasharray="5 5" fill="none"/><path class="pele-marker" d="M291.15,106L299.15,102.64L299.15,109.36Z" fill="#38BDF8" fill-opacity="0.88" stroke="none"/></g></g><g class="complexloop-packets"><circle r="3.8" fill="#38BDF8"><animateMotion dur="2.10s" begin="-0.20s" repeatCount="indefinite"><mpath href="#complexloop-edge-0"/></animateMotion></circle><circle r="3.8" fill="#818CF8"><animateMotion dur="2.32s" begin="-0.63s" repeatCount="indefinite"><mpath href="#complexloop-edge-1"/></animateMotion></circle><circle r="3.8" fill="#38BDF8"><animateMotion dur="2.54s" begin="-1.06s" repeatCount="indefinite"><mpath href="#complexloop-edge-2"/></animateMotion></circle><circle r="3.8" fill="#38BDF8"><animateMotion dur="2.76s" begin="-1.49s" repeatCount="indefinite"><mpath href="#complexloop-edge-3"/></animateMotion></circle><circle r="3.2" fill="#38BDF8"><animateMotion dur="3.00s" begin="-1.92s" repeatCount="indefinite"><mpath href="#complexloop-edge-4"/></animateMotion></circle></g><g class="pele-edge-labels" font-size="14"><g class="pele-edge-label" data-id="L_check_done_0"><rect x="818.68" y="87.5" width="29.78" height="21" rx="3" fill="var(--_bg)"/><text x="833.57" y="102.9" text-anchor="middle">yes</text></g><g class="pele-edge-label" data-id="L_check_plan_0"><rect x="360.65" y="113.5" width="36" height="21" rx="3" fill="var(--_bg)"/><text x="378.65" y="128.9" text-anchor="middle">retry</text></g></g><g class="pele-nodes"><g class="pele-node pele-shape-rect cyan" data-id="prompt" transform="translate(90.01,98)"><rect x="-62.01" y="-24" width="124.02" height="48" rx="12" class="complexloop-card"/><rect x="-52.0" y="-11.0" width="5" height="22.0" rx="2.5" fill="#38BDF8"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">User prompt</text></g><g class="pele-node pele-shape-rect indigo" data-id="plan" transform="translate(245.58,98)"><rect x="-45.57" y="-24" width="91.14" height="48" rx="12" class="complexloop-card"/><rect x="-35.6" y="-11.0" width="5" height="22.0" rx="2.5" fill="#818CF8"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">Planner</text></g><g class="pele-node pele-shape-rect amber" data-id="tool" transform="translate(506.94,72)"><rect x="-47.78" y="-24" width="95.57" height="48" rx="12" class="complexloop-card"/><rect x="-37.8" y="-11.0" width="5" height="22.0" rx="2.5" fill="#FBBF24"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">Tool call</text></g><g class="pele-node pele-shape-diam" data-id="check" transform="translate(679.45,98)"><polygon points="0,-47.95 76.73,0 0,47.96 -76.73,0" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">Tests pass?</text></g><g class="pele-node pele-shape-stadium emerald" data-id="done" transform="translate(924.41,98)"><rect x="-46.45" y="-24" width="92.9" height="48" rx="12" class="complexloop-card"/><rect x="-36.5" y="-11.0" width="5" height="22.0" rx="2.5" fill="#34D399"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">Reply</text></g></g>
  </g>

  <rect x="307" y="274" width="469" height="30" rx="15" class="complexloop-card"/>
  <text x="541.5" y="293" text-anchor="middle" class="complexloop-footer">flowchart LR with subgraphs, a decision &amp; a retry edge</text>
</svg>
