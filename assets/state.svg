<svg xmlns="http://www.w3.org/2000/svg" class="state-root" viewBox="0 0 869 277" width="869" height="277" role="img" aria-label="State machine · one transition at a time">
  <defs>
    <style>
      .state-root {
        --mv-bg: #070B14;
        --mv-card: #0F172A;
        --mv-border: rgba(148,163,184,0.24);
        --mv-fg: #F8FAFC;
        --mv-muted: #94A3B8;
        --mv-title: #38BDF8;
        --mv-dot: rgba(148,163,184,0.14);
        --mv-hub-start: #1E293B;
        --mv-hub-end: #0F172A;
        --pele-series-1: #38BDF8;
        --pele-series-2: #818CF8;
        --pele-series-3: #FBBF24;
        --pele-series-4: #34D399;
        --pele-series-5: #F472B6;
      }
      .state-bg { fill: var(--mv-bg); }
      .state-card { fill: var(--mv-card); stroke: var(--mv-border); stroke-width: 1.2; }
      .state-dot { fill: var(--mv-dot); }
      .state-title { font: 700 13px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 2px; fill: var(--mv-title); text-transform: uppercase; }
      .state-footer { font: 500 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--mv-muted); }
      .state-stage { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; fill: var(--mv-fg); }
      .pele-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: var(--mv-fg); }
      .pele-label tspan:first-child { font-size: 14.5px; font-weight: 700; fill: var(--mv-fg); }
      .pele-label tspan:nth-child(n+2) { font-size: 11.5px; font-weight: 400; fill: var(--mv-muted); }
      .pele-cluster-label { font-size: 12px; font-weight: 600; letter-spacing: 0.04em; fill: var(--mv-muted); }
      .pele-edge-label rect { fill: var(--mv-card); stroke: var(--mv-border); stroke-width: 1; rx: 6; }
      .pele-edge-label text { font-size: 12px; font-weight: 600; fill: var(--mv-fg); }
      .pele-branch .pele-label { font-size: 12px; font-weight: 700; fill: #070B14; }
      .pele-task .pele-label { font-size: 12px; font-weight: 700; fill: var(--mv-fg); }
      .pele-task .pele-label[fill] { fill: #070B14; }
      .pele-commit-label text { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; fill: var(--mv-muted); }
      .state-hub-node .pele-label tspan:first-child { font-size: 16px; font-weight: 700; fill: var(--mv-fg); }
      .state-hub-node .pele-label tspan:nth-child(2) { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; fill: var(--mv-title); }
      .state-flow { stroke-dasharray: 6 14; stroke-linecap: round; animation: state-dash 1.80s linear infinite; }
      .state-pulse { transform-box: fill-box; transform-origin: center; animation: state-ring 3.20s ease-in-out infinite; }
      @keyframes state-dash { to { stroke-dashoffset: -40; } }
      @keyframes state-ring {
        0%, 100% { opacity: 0.25; transform: scale(0.97); }
        50% { opacity: 0.65; transform: scale(1.03); }
      }
      .state-flash { opacity: 0.15; animation: state-flash 4s linear infinite; }
      @keyframes state-flash { 0% { opacity: 0.15; } 6% { opacity: 0.95; } 22%, 100% { opacity: 0.15; } }
      .state-working > rect { animation: state-working 3.20s ease-in-out infinite; }
      @keyframes state-working { 50% { fill-opacity: 0.55; } }
      @media (prefers-reduced-motion: reduce) {
        .state-flow, .state-pulse, .state-flash, .state-working > rect { animation: none; }
        /* SMIL ignores the media query: what moves by it (packets, playhead, markers) goes */
        .state-packets, .state-smil { display: none; }
      }
    </style>
    <pattern id="state-dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" class="state-dot"/>
    </pattern>
    <radialGradient id="state-glow-l" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="state-glow-r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="state-hub-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--mv-hub-start)"/>
      <stop offset="100%" stop-color="var(--mv-hub-end)"/>
    </linearGradient>
  </defs>

  <rect width="869" height="277" rx="18" class="state-bg"/>
  <rect width="869" height="277" rx="18" fill="url(#state-dots)"/>
  <circle cx="226" cy="100" r="243" fill="url(#state-glow-l)"/>
  <circle cx="643" cy="177" r="243" fill="url(#state-glow-r)"/>
  <text x="434.5" y="42" text-anchor="middle" class="state-title">State machine · one transition at a time</text>

  <g class="state-stage" transform="translate(52,76)" style="--_bg:var(--mv-bg);--_fg:var(--mv-fg);--_m:var(--mv-muted);--_l:#38BDF8;--_s:var(--mv-card);--_a:var(--mv-hub-start);--_b:var(--mv-border);--_c:#38BDF8;--_r:12px;--_w:700;--_hw:700;--_tw:700">
    <g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge pele-transition" data-id="edge0"><path id="state-edge-0" d="M22,73.25L59,73.25" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.8" fill="none"/><path class="pele-marker" d="M66,73.25L58,76.61L58,69.89Z" fill="#38BDF8" fill-opacity="0.88" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge1"><path id="state-edge-1" d="M123.79,65.25L131.89,65.25C137.09,65.25 137.09,30 142.29,30L216.36,30" stroke="#818CF8" stroke-width="2" stroke-opacity="0.8" fill="none"/><path class="pele-marker" d="M223.36,30L215.36,33.36L215.36,26.64Z" fill="#818CF8" fill-opacity="0.88" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge2"><path id="state-edge-2" d="M317.62,30L435.87,30" stroke="#FBBF24" stroke-width="2" stroke-opacity="0.8" fill="none"/><path class="pele-marker" d="M442.87,30L434.87,33.36L434.87,26.64Z" fill="#FBBF24" fill-opacity="0.88" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge3"><path id="state-edge-3" d="M545.13,22L640.62,22C646.24,22 646.24,53 651.87,53L655.62,53" stroke="#34D399" stroke-width="2" stroke-opacity="0.8" fill="none"/><path class="pele-marker" d="M662.62,53L654.62,56.36L654.62,49.64Z" fill="#34D399" fill-opacity="0.88" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge4"><path id="state-edge-4" d="M662.62,63L567.13,63C561.51,63 561.51,38 555.88,38L552.13,38" stroke="#F472B6" stroke-width="2" stroke-opacity="0.8" fill="none"/><path class="pele-marker" d="M545.13,38L553.13,34.64L553.13,41.36Z" fill="#F472B6" fill-opacity="0.88" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge5"><path id="state-edge-5" d="M662.62,73L649.62,73C635.93,73 635.93,104.5 622.25,104.5L223.36,104.5C180.08,104.5 180.08,81.25 136.79,81.25L130.79,81.25" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.8" fill="none"/><path class="pele-marker" d="M123.79,81.25L131.79,77.89L131.79,84.61Z" fill="#38BDF8" fill-opacity="0.88" stroke="none"/></g></g><g class="state-packets"><circle r="4" fill="#38BDF8"><animateMotion dur="6.90s" begin="-0.40s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.1467;1"><mpath href="#state-edge-0"/></animateMotion><animate attributeName="opacity" dur="6.90s" begin="-0.40s" repeatCount="indefinite" keyTimes="0;0.0200;0.1467;0.1867;1" values="1;1;1;0;0"/></circle><circle r="4" fill="#818CF8"><animateMotion dur="6.90s" begin="-0.40s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.1667;0.3133;1"><mpath href="#state-edge-1"/></animateMotion><animate attributeName="opacity" dur="6.90s" begin="-0.40s" repeatCount="indefinite" keyTimes="0;0.1667;0.1867;0.3133;0.3533;1" values="0;0;1;1;0;0"/></circle><circle r="4" fill="#FBBF24"><animateMotion dur="6.90s" begin="-0.40s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.3333;0.4800;1"><mpath href="#state-edge-2"/></animateMotion><animate attributeName="opacity" dur="6.90s" begin="-0.40s" repeatCount="indefinite" keyTimes="0;0.3333;0.3533;0.4800;0.5200;1" values="0;0;1;1;0;0"/></circle><circle r="4" fill="#34D399"><animateMotion dur="6.90s" begin="-0.40s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.5000;0.6467;1"><mpath href="#state-edge-3"/></animateMotion><animate attributeName="opacity" dur="6.90s" begin="-0.40s" repeatCount="indefinite" keyTimes="0;0.5000;0.5200;0.6467;0.6867;1" values="0;0;1;1;0;0"/></circle><circle r="4" fill="#F472B6"><animateMotion dur="6.90s" begin="-0.40s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.6667;0.8133;1"><mpath href="#state-edge-4"/></animateMotion><animate attributeName="opacity" dur="6.90s" begin="-0.40s" repeatCount="indefinite" keyTimes="0;0.6667;0.6867;0.8133;0.8533;1" values="0;0;1;1;0;0"/></circle><circle r="4" fill="#38BDF8"><animateMotion dur="6.90s" begin="-0.40s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.8333;0.9800;1"><mpath href="#state-edge-5"/></animateMotion><animate attributeName="opacity" dur="6.90s" begin="-0.40s" repeatCount="indefinite" keyTimes="0;0.8333;0.8533;0.9800;1.0000;1" values="0;0;1;1;0;0"/></circle></g><g class="pele-edge-labels" font-size="14"><g class="pele-edge-label" data-id="edge1"><rect x="144.29" y="19.5" width="51.57" height="21" rx="3" fill="var(--_bg)"/><text x="170.08" y="34.9" text-anchor="middle">prompt</text></g><g class="pele-edge-label" data-id="edge2"><rect x="338.12" y="19.5" width="77.26" height="21" rx="3" fill="var(--_bg)"/><text x="376.75" y="34.9" text-anchor="middle">plan_ready</text></g><g class="pele-edge-label" data-id="edge3"><rect x="569.13" y="11.5" width="69.49" height="21" rx="3" fill="var(--_bg)"/><text x="603.87" y="26.9" text-anchor="middle">tool_done</text></g><g class="pele-edge-label" data-id="edge4"><rect x="585.87" y="52.5" width="36" height="21" rx="3" fill="var(--_bg)"/><text x="603.87" y="67.9" text-anchor="middle">retry</text></g><g class="pele-edge-label" data-id="edge5"><rect x="461.6" y="94" width="64.8" height="21" rx="3" fill="var(--_bg)"/><text x="494" y="109.4" text-anchor="middle">complete</text></g></g><g class="pele-nodes"><g class="pele-node pele-state-start" data-id="root_start" transform="translate(15,73.25)"><circle r="7" fill="var(--_l)"/></g><g class="pele-node pele-state" data-id="Idle" transform="translate(94.9,73.25)"><rect x="-28.9" y="-22" width="57.79" height="44" rx="12" class="state-card"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">Idle</text></g><g class="pele-node pele-state" data-id="Planning" transform="translate(270.49,30)"><rect x="-47.13" y="-22" width="94.26" height="44" rx="12" class="state-card"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">Planning</text></g><g class="pele-node pele-state" data-id="Executing" transform="translate(494,30)"><rect x="-51.13" y="-22" width="102.26" height="44" rx="12" class="state-card"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">Executing</text></g><g class="pele-node pele-state" data-id="Verifying" transform="translate(709.74,63)"><rect x="-47.12" y="-22" width="94.24" height="44" rx="12" class="state-card"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">Verifying</text></g></g>
  </g>

  <rect x="231" y="225" width="407" height="30" rx="15" class="state-card"/>
  <text x="434.5" y="244" text-anchor="middle" class="state-footer">stateDiagram-v2: a token walks the transitions</text>
</svg>
