<svg xmlns="http://www.w3.org/2000/svg" class="class-root" viewBox="0 0 463 413" width="463" height="413" role="img" aria-label="Class diagram · relations draw">
  <defs>
    <style>
      .class-root {
        --mv-bg: #070B14;
        --mv-card: #0F172A;
        --mv-border: rgba(148,163,184,0.24);
        --mv-fg: #F8FAFC;
        --mv-muted: #94A3B8;
        --mv-title: #38BDF8;
        --mv-dot: rgba(148,163,184,0.14);
        --mv-hub-start: #1E293B;
        --mv-hub-end: #0F172A;
        --pele-series-1: #38BDF8;
        --pele-series-2: #818CF8;
        --pele-series-3: #FBBF24;
        --pele-series-4: #34D399;
        --pele-series-5: #F472B6;
      }
      .class-bg { fill: var(--mv-bg); }
      .class-card { fill: var(--mv-card); stroke: var(--mv-border); stroke-width: 1.2; }
      .class-dot { fill: var(--mv-dot); }
      .class-title { font: 700 13px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 2px; fill: var(--mv-title); text-transform: uppercase; }
      .class-footer { font: 500 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--mv-muted); }
      .class-stage { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; fill: var(--mv-fg); }
      .pele-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: var(--mv-fg); }
      .pele-label tspan:first-child { font-size: 14.5px; font-weight: 700; fill: var(--mv-fg); }
      .pele-label tspan:nth-child(n+2) { font-size: 11.5px; font-weight: 400; fill: var(--mv-muted); }
      .pele-cluster-label { font-size: 12px; font-weight: 600; letter-spacing: 0.04em; fill: var(--mv-muted); }
      .pele-edge-label rect { fill: var(--mv-card); stroke: var(--mv-border); stroke-width: 1; rx: 6; }
      .pele-edge-label text { font-size: 12px; font-weight: 600; fill: var(--mv-fg); }
      .pele-branch .pele-label { font-size: 12px; font-weight: 700; fill: #070B14; }
      .pele-task .pele-label { font-size: 12px; font-weight: 700; fill: var(--mv-fg); }
      .pele-task .pele-label[fill] { fill: #070B14; }
      .pele-commit-label text { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; fill: var(--mv-muted); }
      .class-hub-node .pele-label tspan:first-child { font-size: 16px; font-weight: 700; fill: var(--mv-fg); }
      .class-hub-node .pele-label tspan:nth-child(2) { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; fill: var(--mv-title); }
      .class-flow { stroke-dasharray: 6 14; stroke-linecap: round; animation: class-dash 1.80s linear infinite; }
      .class-pulse { transform-box: fill-box; transform-origin: center; animation: class-ring 3.20s ease-in-out infinite; }
      @keyframes class-dash { to { stroke-dashoffset: -40; } }
      @keyframes class-ring {
        0%, 100% { opacity: 0.25; transform: scale(0.97); }
        50% { opacity: 0.65; transform: scale(1.03); }
      }
      .class-flash { opacity: 0.15; animation: class-flash 4s linear infinite; }
      @keyframes class-flash { 0% { opacity: 0.15; } 6% { opacity: 0.95; } 22%, 100% { opacity: 0.15; } }
      .class-working > rect { animation: class-working 3.20s ease-in-out infinite; }
      @keyframes class-working { 50% { fill-opacity: 0.55; } }
      @media (prefers-reduced-motion: reduce) {
        .class-flow, .class-pulse, .class-flash, .class-working > rect { animation: none; }
        /* SMIL ignores the media query: what moves by it (packets, playhead, markers) goes */
        .class-packets, .class-smil { display: none; }
      }
      .class-fx-fade {  animation: class-in-fade 0.60s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
      @keyframes class-in-fade { from { opacity: 0; } }
      .class-fx-pop { transform-box: fill-box; transform-origin: center; animation: class-in-pop 0.60s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
      @keyframes class-in-pop { from { opacity: 0; scale: 0.6; } }
      .class-fx-bloom { transform-box: view-box; transform-origin: 0 0; animation: class-in-bloom 0.60s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
      @keyframes class-in-bloom { from { opacity: 0; scale: 0; } }
      .class-fx-rise {  animation: class-in-rise 0.60s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
      @keyframes class-in-rise { from { opacity: 0; translate: 0 12px; } }
      .class-fx-grow-y { transform-box: fill-box; transform-origin: bottom; animation: class-in-grow-y 0.60s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
      @keyframes class-in-grow-y { from { scale: 1 0; } }
      .class-fx-grow-x { transform-box: fill-box; transform-origin: left; animation: class-in-grow-x 0.60s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
      @keyframes class-in-grow-x { from { scale: 0 1; } }
      .class-fx-draw { stroke-dasharray: 1; animation: class-in-draw 0.60s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
      @keyframes class-in-draw { from { stroke-dashoffset: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .class-fx-fade, .class-fx-pop, .class-fx-bloom, .class-fx-rise, .class-fx-grow-y, .class-fx-grow-x, .class-fx-draw { animation: none; }
      }
    </style>
    <pattern id="class-dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" class="class-dot"/>
    </pattern>
    <radialGradient id="class-glow-l" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="class-glow-r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="class-hub-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--mv-hub-start)"/>
      <stop offset="100%" stop-color="var(--mv-hub-end)"/>
    </linearGradient>
  </defs>

  <rect width="463" height="413" rx="18" class="class-bg"/>
  <rect width="463" height="413" rx="18" fill="url(#class-dots)"/>
  <circle cx="120" cy="149" r="130" fill="url(#class-glow-l)"/>
  <circle cx="343" cy="264" r="130" fill="url(#class-glow-r)"/>
  <text x="231.5" y="42" text-anchor="middle" class="class-title">Class diagram · relations draw</text>

  <g class="class-stage" transform="translate(64,76)" style="--_bg:var(--mv-bg);--_fg:var(--mv-fg);--_m:var(--mv-muted);--_l:#38BDF8;--_s:var(--mv-card);--_a:var(--mv-hub-start);--_b:var(--mv-border);--_c:#38BDF8;--_r:12px;--_w:700;--_hw:700;--_tw:700">
    <g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge pele-relation" data-id="id_Diagram_Flowchart_1"><path d="M143.12,126L143.12,132C143.12,151 65.34,151 65.34,170" class="class-fx-draw" style="animation-delay:0.66s" pathLength="1"/><path class="pele-marker class-fx-fade" d="M143.12,114L149.12,126L137.12,126Z" stroke-linejoin="round" style="animation-delay:1.06s"/></g><g class="pele-edge pele-relation" data-id="id_Diagram_Sequence_2"><path d="M167.12,126L167.12,132C167.12,151 244.9,151 244.9,170" class="class-fx-draw" style="animation-delay:0.78s" pathLength="1"/><path class="pele-marker class-fx-fade" d="M167.12,114L173.12,126L161.12,126Z" stroke-linejoin="round" style="animation-delay:1.18s"/></g></g><g class="pele-nodes"><g class="pele-node pele-class class-fx-rise" data-id="Diagram" transform="translate(155.12,61)" style="animation-delay:0.00s"><rect x="-58.88" y="-53" width="117.76" height="106" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><path class="pele-divider" d="M-58.88,-13H58.88M-58.88,20H58.88" fill="none" stroke="var(--_b)"/><text class="pele-label" font-weight="var(--_hw)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-27.4">Diagram</tspan></text><g class="pele-members" font-size="14"><text class="pele-member pele-attribute" x="-46.88" y="8.4">+String source</text><text class="pele-member pele-method" x="-46.88" y="41.4">+render() : Svg</text></g></g><g class="pele-node pele-class class-fx-rise" data-id="Flowchart" transform="translate(65.34,211.5)" style="animation-delay:0.12s"><rect x="-57.34" y="-41.5" width="114.68" height="83" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><path class="pele-divider" d="M-57.34,-1.5H57.34M-57.34,31.5H57.34" fill="none" stroke="var(--_b)"/><text class="pele-label" font-weight="var(--_hw)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-15.9">Flowchart</tspan></text><g class="pele-members" font-size="14"><text class="pele-member pele-attribute" x="-45.34" y="19.9">+edges Edge[]</text></g></g><g class="pele-node pele-class class-fx-rise" data-id="Sequence" transform="translate(244.9,211.5)" style="animation-delay:0.24s"><rect x="-82.22" y="-41.5" width="164.45" height="83" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><path class="pele-divider" d="M-82.22,-1.5H82.22M-82.22,31.5H82.22" fill="none" stroke="var(--_b)"/><text class="pele-label" font-weight="var(--_hw)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-15.9">Sequence</tspan></text><g class="pele-members" font-size="14"><text class="pele-member pele-attribute" x="-70.22" y="19.9">+messages Message[]</text></g></g></g>
  </g>

  <rect x="32" y="361" width="399" height="30" rx="15" class="class-card"/>
  <text x="231.5" y="380" text-anchor="middle" class="class-footer">classes rise in, inheritance draws (no packets)</text>
</svg>
