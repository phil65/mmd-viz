<svg xmlns="http://www.w3.org/2000/svg" class="sankey-root" viewBox="0 0 720 568" width="720" height="568" role="img" aria-label="Sankey · particles in proportion">
  <defs>
    <style>
      .sankey-root {
        --mv-bg: #070B14;
        --mv-card: #0F172A;
        --mv-border: rgba(148,163,184,0.24);
        --mv-fg: #F8FAFC;
        --mv-muted: #94A3B8;
        --mv-title: #38BDF8;
        --mv-dot: rgba(148,163,184,0.14);
        --mv-hub-start: #1E293B;
        --mv-hub-end: #0F172A;
        --pele-series-1: #38BDF8;
        --pele-series-2: #818CF8;
        --pele-series-3: #FBBF24;
        --pele-series-4: #34D399;
        --pele-series-5: #F472B6;
        --pele-series-6: #FB7185;
        --pele-series-7: #A78BFA;
        --pele-series-8: #2DD4BF;
      }
      .sankey-bg { fill: var(--mv-bg); }
      .sankey-card { fill: var(--mv-card); stroke: var(--mv-border); stroke-width: 1.2; }
      .sankey-dot { fill: var(--mv-dot); }
      .sankey-title { font: 700 13px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 2px; fill: var(--mv-title); text-transform: uppercase; }
      .sankey-footer { font: 500 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--mv-muted); }
      .sankey-stage { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; fill: var(--mv-fg); }
      .pele-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: var(--mv-fg); }
      .pele-label tspan:first-child { font-size: 14.5px; font-weight: 700; fill: var(--mv-fg); }
      .pele-label tspan:nth-child(n+2) { font-size: 11.5px; font-weight: 400; fill: var(--mv-muted); }
      .pele-cluster-label { font-size: 12px; font-weight: 600; letter-spacing: 0.04em; fill: var(--mv-muted); }
      .pele-edge-label rect { fill: var(--mv-card); stroke: var(--mv-border); stroke-width: 1; rx: 6; }
      .pele-edge-label text { font-size: 12px; font-weight: 600; fill: var(--mv-fg); }
      .pele-branch .pele-label { font-size: 12px; font-weight: 700; fill: #070B14; }
      .pele-task .pele-label { font-size: 12px; font-weight: 700; fill: var(--mv-fg); }
      .pele-task .pele-label[fill] { fill: #070B14; }
      .pele-commit-label text { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; fill: var(--mv-muted); }
      .sankey-hub-node .pele-label tspan:first-child { font-size: 16px; font-weight: 700; fill: var(--mv-fg); }
      .sankey-hub-node .pele-label tspan:nth-child(n+2) { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; fill: var(--mv-title); }
      .sankey-flow { stroke-dasharray: 6 14; stroke-linecap: round; animation: sankey-dash 1.80s linear infinite; }
      .sankey-pulse { transform-box: fill-box; transform-origin: center; animation: sankey-ring 3.20s ease-in-out infinite; }
      @keyframes sankey-dash { to { stroke-dashoffset: -40; } }
      @keyframes sankey-ring {
        0%, 100% { opacity: 0.25; transform: scale(0.97); }
        50% { opacity: 0.65; transform: scale(1.03); }
      }
      .sankey-flash { opacity: 0.15; animation: sankey-flash 4s linear infinite; }
      @keyframes sankey-flash { 0% { opacity: 0.15; } 6% { opacity: 0.95; } 22%, 100% { opacity: 0.15; } }
      .sankey-working > rect { animation: sankey-working 3.20s ease-in-out infinite; }
      @keyframes sankey-working { 50% { fill-opacity: 0.55; } }
      @media (prefers-reduced-motion: reduce) {
        .sankey-flow, .sankey-pulse, .sankey-flash, .sankey-working > rect { animation: none; }
        /* SMIL ignores the media query: what moves by it (packets, playhead, markers) goes */
        .sankey-packets, .sankey-smil { display: none; }
      }
    </style>
    <pattern id="sankey-dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" class="sankey-dot"/>
    </pattern>
    <radialGradient id="sankey-glow-l" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sankey-glow-r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sankey-hub-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--mv-hub-start)"/>
      <stop offset="100%" stop-color="var(--mv-hub-end)"/>
    </linearGradient>
    <path id="sankey-sankey-0" d="M10.0,280.0C103.3,280.0 103.3,280.0 196.7,280.0"/>
    <path id="sankey-sankey-1" d="M10.0,80.0C300.0,80.0 300.0,80.0 590.0,80.0"/>
    <path id="sankey-sankey-2" d="M206.7,330.0C300.0,330.0 300.0,330.0 393.3,330.0"/>
    <path id="sankey-sankey-3" d="M206.7,210.0C398.3,210.0 398.3,237.0 590.0,237.0"/>
    <path id="sankey-sankey-4" d="M403.3,300.0C496.7,300.0 496.7,354.0 590.0,354.0"/>
  </defs>

  <rect width="720" height="568" rx="18" class="sankey-bg"/>
  <rect width="720" height="568" rx="18" fill="url(#sankey-dots)"/>
  <circle cx="187" cy="204" r="202" fill="url(#sankey-glow-l)"/>
  <circle cx="533" cy="364" r="202" fill="url(#sankey-glow-r)"/>
  <text x="360" y="42" text-anchor="middle" class="sankey-title">Sankey · particles in proportion</text>

  <g class="sankey-stage" transform="translate(52,76)" style="--_bg:var(--mv-bg);--_fg:var(--mv-fg);--_m:var(--mv-muted);--_l:#38BDF8;--_s:var(--mv-card);--_a:var(--mv-hub-start);--_b:var(--mv-border);--_c:#38BDF8;--_r:12px;--_w:700;--_hw:700;--_tw:700">
