.00s" repeatCount="indefinite"><mpath href="#sankey-sankey-0"/></animateMotion></circle><circle r="4.0" fill="#38BDF8" fill-opacity="0.65"><animateMotion dur="3.00s" begin="-2.50s" repeatCount="indefinite"><mpath href="#sankey-sankey-0"/></animateMotion></circle><circle r="4.0" fill="#38BDF8" fill-opacity="0.92"><animateMotion dur="3.00s" begin="-1.11s" repeatCount="indefinite"><mpath href="#sankey-sankey-1"/></animateMotion></circle><circle r="4.0" fill="#38BDF8" fill-opacity="0.65"><animateMotion dur="3.00s" begin="-1.86s" repeatCount="indefinite"><mpath href="#sankey-sankey-1"/></animateMotion></circle><circle r="4.0" fill="#38BDF8" fill-opacity="0.92"><animateMotion dur="3.00s" begin="-2.61s" repeatCount="indefinite"><mpath href="#sankey-sankey-1"/></animateMotion></circle><circle r="4.0" fill="#38BDF8" fill-opacity="0.65"><animateMotion dur="3.00s" begin="-3.36s" repeatCount="indefinite"><mpath href="#sankey-sankey-1"/></animateMotion></circle><circle r="4.0" fill="#818CF8" fill-opacity="0.92"><animateMotion dur="3.00s" begin="-2.22s" repeatCount="indefinite"><mpath href="#sankey-sankey-2"/></animateMotion></circle><circle r="4.0" fill="#818CF8" fill-opacity="0.65"><animateMotion dur="3.00s" begin="-2.97s" repeatCount="indefinite"><mpath href="#sankey-sankey-2"/></animateMotion></circle><circle r="4.0" fill="#818CF8" fill-opacity="0.92"><animateMotion dur="3.00s" begin="-3.72s" repeatCount="indefinite"><mpath href="#sankey-sankey-2"/></animateMotion></circle><circle r="4.0" fill="#818CF8" fill-opacity="0.65"><animateMotion dur="3.00s" begin="-4.47s" repeatCount="indefinite"><mpath href="#sankey-sankey-2"/></animateMotion></circle><circle r="4.0" fill="#818CF8" fill-opacity="0.92"><animateMotion dur="3.00s" begin="-0.33s" repeatCount="indefinite"><mpath href="#sankey-sankey-3"/></animateMotion></circle><circle r="4.0" fill="#818CF8" fill-opacity="0.65"><animateMotion dur="3.00s" begin="-1.33s" repeatCount="indefinite"><mpath href="#sankey-sankey-3"/></animateMotion></circle><circle r="4.0" fill="#818CF8" fill-opacity="0.92"><animateMotion dur="3.00s" begin="-2.33s" repeatCount="indefinite"><mpath href="#sankey-sankey-3"/></animateMotion></circle><circle r="3.7" fill="#34D399" fill-opacity="0.92"><animateMotion dur="3.00s" begin="-1.44s" repeatCount="indefinite"><mpath href="#sankey-sankey-4"/></animateMotion></circle><circle r="3.7" fill="#34D399" fill-opacity="0.65"><animateMotion dur="3.00s" begin="-2.94s" repeatCount="indefinite"><mpath href="#sankey-sankey-4"/></animateMotion></circle></g><g class="pele-sankey-nodes"><rect class="pele-sankey-node" data-id="Prompt" x="0" y="0" width="10" height="400" rx="2" fill="var(--pele-series-1,#4c78a8)"/><rect class="pele-sankey-node" data-id="Planner" x="196.67" y="160" width="10" height="240" rx="2" fill="var(--pele-series-2,#f58518)"/><rect class="pele-sankey-node" data-id="Direct answer" x="590" y="0" width="10" height="160" rx="2" fill="var(--pele-series-3,#54a24b)"/><rect class="pele-sankey-node" data-id="Coder" x="393.33" y="260" width="10" height="140" rx="2" fill="var(--pele-series-4,#e45756)"/><rect class="pele-sankey-node" data-id="Research" x="590" y="187" width="10" height="100" rx="2" fill="var(--pele-series-5,#72b7b2)"/><rect class="pele-sankey-node" data-id="Tests" x="590" y="314" width="10" height="80" rx="2" fill="var(--pele-series-6,#eeca3b)"/></g><g class="pele-labels" font-size="14"><g class="pele-label" data-id="Prompt"><text x="16" y="204.9" text-anchor="start">Prompt <tspan class="pele-sankey-value" fill="var(--_m)">100</tspan></text></g><g class="pele-label" data-id="Planner"><text x="212.67" y="284.9" text-anchor="start">Planner <tspan class="pele-sankey-value" fill="var(--_m)">60</tspan></text></g><g class="pele-label" data-id="Direct answer"><text x="584" y="84.9" text-anchor="end">Direct answer <tspan class="pele-sankey-value" fill="var(--_m)">40</tspan></text></g><g class="pele-label" data-id="Coder"><text x="387.33" y="334.9" text-anchor="end">Coder 