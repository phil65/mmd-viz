<svg xmlns="http://www.w3.org/2000/svg" class="mmd-root" viewBox="0 0 720 568" width="720" height="568" role="img" aria-label="SANKEY · WEIGHTED FLOW PARTICLES">
  <defs>
    <style>
      .mmd-root {
        --mv-bg: #070B14;
        --mv-card: #0F172A;
        --mv-border: rgba(148,163,184,0.24);
        --mv-fg: #F8FAFC;
        --mv-muted: #94A3B8;
        --mv-title: #38BDF8;
        --mv-dot: rgba(148,163,184,0.14);
        --mv-hub-start: #1E293B;
        --mv-hub-end: #0F172A;
        --pele-series-1: #38BDF8;
        --pele-series-2: #818CF8;
        --pele-series-3: #FBBF24;
        --pele-series-4: #34D399;
        --pele-series-5: #F472B6;
      }
      .mmd-bg { fill: var(--mv-bg); }
      .mmd-card { fill: var(--mv-card); stroke: var(--mv-border); stroke-width: 1.2; }
      .mmd-dot { fill: var(--mv-dot); }
      .mmd-title { font: 700 13px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 2px; fill: var(--mv-title); text-transform: uppercase; }
      .mmd-footer { font: 500 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--mv-muted); }
      .mmd-stage { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; fill: var(--mv-fg); }
      .pele-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: var(--mv-fg); }
      .pele-label tspan:first-child { font-size: 14.5px; font-weight: 700; fill: var(--mv-fg); }
      .pele-label tspan:nth-child(n+2) { font-size: 11.5px; font-weight: 400; fill: var(--mv-muted); }
      .pele-cluster-label { font-size: 12px; font-weight: 600; letter-spacing: 0.04em; fill: var(--mv-muted); }
      .pele-edge-label rect { fill: var(--mv-card); stroke: var(--mv-border); stroke-width: 1; rx: 6; }
      .pele-edge-label text { font-size: 12px; font-weight: 600; fill: var(--mv-fg); }
      .pele-branch .pele-label { font-size: 12px; font-weight: 700; fill: #070B14; }
      .pele-task .pele-label { font-size: 12px; font-weight: 700; fill: #070B14; }
      .pele-commit-label text { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; fill: var(--mv-muted); }
      .mmd-hub-node .pele-label tspan:first-child { font-size: 16px; font-weight: 700; fill: var(--mv-fg); }
      .mmd-hub-node .pele-label tspan:nth-child(2) { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; fill: var(--mv-title); }
      .mmd-flow { stroke-dasharray: 6 14; stroke-linecap: round; animation: mmd-dash 1.80s linear infinite; }
      .mmd-pulse { transform-box: fill-box; transform-origin: center; animation: mmd-ring 3.20s ease-in-out infinite; }
      @keyframes mmd-dash { to { stroke-dashoffset: -40; } }
      @keyframes mmd-ring {
        0%, 100% { opacity: 0.25; transform: scale(0.97); }
        50% { opacity: 0.65; transform: scale(1.03); }
      }
      @media (prefers-reduced-motion: reduce) {
        .mmd-flow, .mmd-pulse { animation: none; }
      }
    </style>
    <pattern id="mmd-dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" class="mmd-dot"/>
    </pattern>
    <radialGradient id="mmd-glow-l" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mmd-glow-r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mmd-hub-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--mv-hub-start)"/>
      <stop offset="100%" stop-color="var(--mv-hub-end)"/>
    </linearGradient>
    <path id="mmd-sankey-0" d="M10.0,264.7C152.5,264.7 152.5,265.4 295.0,265.4"/>
    <path id="mmd-sankey-1" d="M10.0,91.7C300.0,91.7 300.0,69.2 590.0,69.2"/>
    <path id="mmd-sankey-2" d="M305.0,222.2C447.5,222.2 447.5,225.9 590.0,225.9"/>
    <path id="mmd-sankey-3" d="M305.0,326.0C447.5,326.0 447.5,356.8 590.0,356.8"/>
  </defs>

  <rect width="720" height="568" rx="18" class="mmd-bg"/>
  <rect width="720" height="568" rx="18" fill="url(#mmd-dots)"/>
  <circle cx="187" cy="204" r="202" fill="url(#mmd-glow-l)"/>
  <circle cx="533" cy="364" r="202" fill="url(#mmd-glow-r)"/>
  <text x="360" y="42" text-anchor="middle" class="mmd-title">SANKEY · WEIGHTED FLOW PARTICLES</text>

  <g class="mmd-stage" transform="translate(52,76)" style="--_bg:var(--mv-bg);--_fg:var(--mv-fg);--_m:var(--mv-muted);--_l:#38BDF8;--_s:var(--mv-card);--_a:var(--mv-hub-start);--_b:var(--mv-border);--_c:#38BDF8;--_r:12px">
    <g transform="translate(8,8)"><g class="pele-sankey-links" fill-opacity="0.4"><path class="pele-sankey-link" data-id="Prompt-&gt;Planner" d="M10,160.91C152.5,160.91 152.5,161.65 295,161.65L295,369.25C152.5,369.25 152.5,368.51 10,368.51Z" fill="var(--pele-series-1,#4c78a8)"><title>Prompt → Planner: 60</title></path><path class="pele-sankey-link" data-id="Prompt-&gt;Direct" d="M10,22.51C300,22.51 300,0 590,0L590,138.4C300,138.4 300,160.91 10,160.91Z" fill="var(--pele-series-1,#4c78a8)"><title>Prompt → Direct: 40</title></path><path class="pele-sankey-link" data-id="Planner-&gt;Coder" d="M305,161.65C447.5,161.65 447.5,165.4 590,165.4L590,286.5C447.5,286.5 447.5,282.75 305,282.75Z" fill="var(--pele-series-2,#f58518)"><title>Planner → Coder: 35</title></path><path class="pele-sankey-link" data-id="Planner-&gt;Research" d="M305,282.75C447.5,282.75 447.5,313.5 590,313.5L590,400C447.5,400 447.5,369.25 305,369.25Z" fill="var(--pele-series-2,#f58518)"><title>Planner → Research: 25</title></path></g><g class="mmd-packets"><circle r="3.6" fill="#38BDF8" fill-opacity="0.92"><animateMotion dur="2.60s" begin="-0.20s" repeatCount="indefinite"><mpath href="#mmd-sankey-0"/></animateMotion></circle><circle r="2.8" fill="#38BDF8" fill-opacity="0.65"><animateMotion dur="2.60s" begin="-1.50s" repeatCount="indefinite"><mpath href="#mmd-sankey-0"/></animateMotion></circle><circle r="3.6" fill="#38BDF8" fill-opacity="0.92"><animateMotion dur="2.95s" begin="-0.65s" repeatCount="indefinite"><mpath href="#mmd-sankey-1"/></animateMotion></circle><circle r="2.8" fill="#38BDF8" fill-opacity="0.65"><animateMotion dur="2.95s" begin="-2.13s" repeatCount="indefinite"><mpath href="#mmd-sankey-1"/></animateMotion></circle><circle r="3.6" fill="#818CF8" fill-opacity="0.92"><animateMotion dur="3.30s" begin="-1.10s" repeatCount="indefinite"><mpath href="#mmd-sankey-2"/></animateMotion></circle><circle r="2.8" fill="#818CF8" fill-opacity="0.65"><animateMotion dur="3.30s" begin="-2.75s" repeatCount="indefinite"><mpath href="#mmd-sankey-2"/></animateMotion></circle><circle r="3.6" fill="#818CF8" fill-opacity="0.92"><animateMotion dur="2.60s" begin="-1.55s" repeatCount="indefinite"><mpath href="#mmd-sankey-3"/></animateMotion></circle><circle r="2.8" fill="#818CF8" fill-opacity="0.65"><animateMotion dur="2.60s" begin="-2.85s" repeatCount="indefinite"><mpath href="#mmd-sankey-3"/></animateMotion></circle></g><g class="pele-sankey-nodes"><rect class="pele-sankey-node" data-id="Prompt" x="0" y="22.51" width="10" height="346" rx="2" fill="var(--pele-series-1,#4c78a8)"/><rect class="pele-sankey-node" data-id="Planner" x="295" y="161.65" width="10" height="207.6" rx="2" fill="var(--pele-series-2,#f58518)"/><rect class="pele-sankey-node" data-id="Direct" x="590" y="0" width="10" height="138.4" rx="2" fill="var(--pele-series-3,#54a24b)"/><rect class="pele-sankey-node" data-id="Coder" x="590" y="165.4" width="10" height="121.1" rx="2" fill="var(--pele-series-4,#e45756)"/><rect class="pele-sankey-node" data-id="Research" x="590" y="313.5" width="10" height="86.5" rx="2" fill="var(--pele-series-5,#72b7b2)"/></g><g class="pele-labels" font-size="14"><g class="pele-label" data-id="Prompt"><text x="16" y="200.41" text-anchor="start">Prompt <tspan class="pele-sankey-value" fill="var(--_m)">100</tspan></text></g><g class="pele-label" data-id="Planner"><text x="311" y="270.35" text-anchor="start">Planner <tspan class="pele-sankey-value" fill="var(--_m)">60</tspan></text></g><g class="pele-label" data-id="Direct"><text x="584" y="74.1" text-anchor="end">Direct <tspan class="pele-sankey-value" fill="var(--_m)">40</tspan></text></g><g class="pele-label" data-id="Coder"><text x="584" y="230.85" text-anchor="end">Coder <tspan class="pele-sankey-value" fill="var(--_m)">35</tspan></text></g><g class="pele-label" data-id="Research"><text x="584" y="361.65" text-anchor="end">Research <tspan class="pele-sankey-value" fill="var(--_m)">25</tspan></text></g></g></g>
  </g>

  <rect x="172" y="516" width="376" height="30" rx="15" class="mmd-card"/>
  <text x="360" y="535" text-anchor="middle" class="mmd-footer">sankey-beta with centerline Bezier streams</text>
</svg>
