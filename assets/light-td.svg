<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 598 576" width="598" height="576" role="img" aria-label="LIGHT THEME · TOP-DOWN ARCHITECTURE">
  <defs>
    <style>
      .mmd-bg { fill: #F8FAFC; }
      .mmd-title { font: 700 13px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 2px; fill: #0284C7; text-transform: uppercase; }
      .mmd-footer { font: 500 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #475569; }
      .pele-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #0F172A; }
      .pele-label tspan:first-child { font-size: 14.5px; font-weight: 700; fill: #0F172A; }
      .pele-label tspan:nth-child(n+2) { font-size: 11.5px; font-weight: 400; fill: #475569; }
      .mmd-hub-node .pele-label tspan:first-child { font-size: 16px; font-weight: 700; fill: #0F172A; }
      .mmd-hub-node .pele-label tspan:nth-child(2) { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; fill: #0284C7; }
      .mmd-flow { stroke-dasharray: 6 14; stroke-linecap: round; animation: mmd-dash 1.8s linear infinite; }
      .mmd-pulse { transform-box: fill-box; transform-origin: center; animation: mmd-ring 3.2s ease-in-out infinite; }
      @keyframes mmd-dash { to { stroke-dashoffset: -40; } }
      @keyframes mmd-ring {
        0%, 100% { opacity: 0.25; transform: scale(0.97); }
        50% { opacity: 0.65; transform: scale(1.03); }
      }
      @media (prefers-reduced-motion: reduce) {
        .mmd-flow, .mmd-pulse { animation: none; }
      }
    </style>
    <pattern id="mmd-dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="rgba(100,116,139,0.18)"/>
    </pattern>
    <radialGradient id="mmd-glow-l" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mmd-glow-r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mmd-hub-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
  </defs>

  <rect width="598" height="576" rx="18" class="mmd-bg"/>
  <rect width="598" height="576" rx="18" fill="url(#mmd-dots)"/>
  <circle cx="155" cy="207" r="167" fill="url(#mmd-glow-l)"/>
  <circle cx="443" cy="369" r="167" fill="url(#mmd-glow-r)"/>

