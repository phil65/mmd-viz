<svg xmlns="http://www.w3.org/2000/svg" class="mmd-root" viewBox="0 0 512 330" width="512" height="330" role="img" aria-label="TIMELINE · AXIS &amp; MILESTONES">
  <defs>
    <style>
      .mmd-root {
        --mv-bg: #070B14;
        --mv-card: #0F172A;
        --mv-border: rgba(148,163,184,0.24);
        --mv-fg: #F8FAFC;
        --mv-muted: #94A3B8;
        --mv-title: #38BDF8;
        --mv-dot: rgba(148,163,184,0.14);
        --mv-hub-start: #1E293B;
        --mv-hub-end: #0F172A;
        --pele-series-1: #38BDF8;
        --pele-series-2: #818CF8;
        --pele-series-3: #FBBF24;
        --pele-series-4: #34D399;
        --pele-series-5: #F472B6;
      }
      .mmd-bg { fill: var(--mv-bg); }
      .mmd-card { fill: var(--mv-card); stroke: var(--mv-border); stroke-width: 1.2; }
      .mmd-dot { fill: var(--mv-dot); }
      .mmd-title { font: 700 13px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 2px; fill: var(--mv-title); text-transform: uppercase; }
      .mmd-footer { font: 500 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--mv-muted); }
      .mmd-stage { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; fill: var(--mv-fg); }
      .pele-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: var(--mv-fg); }
      .pele-label tspan:first-child { font-size: 14.5px; font-weight: 700; fill: var(--mv-fg); }
      .pele-label tspan:nth-child(n+2) { font-size: 11.5px; font-weight: 400; fill: var(--mv-muted); }
      .pele-cluster-label { font-size: 12px; font-weight: 600; letter-spacing: 0.04em; fill: var(--mv-muted); }
      .pele-edge-label rect { fill: var(--mv-card); stroke: var(--mv-border); stroke-width: 1; rx: 6; }
      .pele-edge-label text { font-size: 12px; font-weight: 600; fill: var(--mv-fg); }
      .pele-branch .pele-label { font-size: 12px; font-weight: 700; fill: #070B14; }
      .pele-task .pele-label { font-size: 12px; font-weight: 700; fill: #070B14; }
      .pele-commit-label text { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; fill: var(--mv-muted); }
      .mmd-hub-node .pele-label tspan:first-child { font-size: 16px; font-weight: 700; fill: var(--mv-fg); }
      .mmd-hub-node .pele-label tspan:nth-child(2) { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; fill: var(--mv-title); }
      .mmd-flow { stroke-dasharray: 6 14; stroke-linecap: round; animation: mmd-dash 1.80s linear infinite; }
      .mmd-pulse { transform-box: fill-box; transform-origin: center; animation: mmd-ring 3.20s ease-in-out infinite; }
      @keyframes mmd-dash { to { stroke-dashoffset: -40; } }
      @keyframes mmd-ring {
        0%, 100% { opacity: 0.25; transform: scale(0.97); }
        50% { opacity: 0.65; transform: scale(1.03); }
      }
      @media (prefers-reduced-motion: reduce) {
        .mmd-flow, .mmd-pulse { animation: none; }
      }
    </style>
    <pattern id="mmd-dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" class="mmd-dot"/>
    </pattern>
    <radialGradient id="mmd-glow-l" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mmd-glow-r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mmd-hub-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--mv-hub-start)"/>
      <stop offset="100%" stop-color="var(--mv-hub-end)"/>
    </linearGradient>
  </defs>

  <rect width="512" height="330" rx="18" class="mmd-bg"/>
  <rect width="512" height="330" rx="18" fill="url(#mmd-dots)"/>
  <circle cx="133" cy="119" r="143" fill="url(#mmd-glow-l)"/>
  <circle cx="379" cy="211" r="143" fill="url(#mmd-glow-r)"/>
  <text x="256" y="42" text-anchor="middle" class="mmd-title">TIMELINE · AXIS &amp; MILESTONES</text>

  <g class="mmd-stage" transform="translate(52,76)" style="--_bg:var(--mv-bg);--_fg:var(--mv-fg);--_m:var(--mv-muted);--_l:#38BDF8;--_s:var(--mv-card);--_a:var(--mv-hub-start);--_b:var(--mv-border);--_c:#38BDF8;--_r:12px">
    <path id="mmd-axis" class="pele-axis" d="M8,68H393" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="2" fill="none"/><path d="M8,68H393" stroke="#38BDF8" stroke-width="2.2" fill="none" class="mmd-flow"/><path class="pele-marker" d="M400,68L392,71.36L392,64.64Z" fill="var(--_l)" stroke="none"/><g class="pele-node pele-period" data-id="2025"><rect x="8" y="8" width="176" height="40" fill="var(--pele-series-1,#4c78a8)" style="rx:var(--_r)"/><text fill="var(--_bg)" x="96" y="33.6" text-anchor="middle">2025</text><path class="pele-edge" d="M96,48V88M96,125V133" fill="none" stroke="var(--_b)"/><circle class="pele-dot" cx="96" cy="68" r="4" fill="var(--pele-series-1,#4c78a8)" stroke="var(--_bg)" stroke-width="2"/><circle cx="96" cy="68" r="8.5" fill="none" stroke="#38BDF8" stroke-width="1.4" class="mmd-pulse" style="animation-delay:-0.00s"/><g class="pele-node pele-event"><rect x="8" y="88" width="176" height="37" fill="var(--pele-series-1,#4c78a8)" fill-opacity="0.16" style="rx:var(--_r)"/><text font-size="14" x="96" y="111.4" text-anchor="middle">Native Agents</text></g><g class="pele-node pele-event"><rect x="8" y="133" width="176" height="37" fill="var(--pele-series-1,#4c78a8)" fill-opacity="0.16" style="rx:var(--_r)"/><text font-size="14" x="96" y="156.4" text-anchor="middle">MCP Tools</text></g></g><g class="pele-node pele-period" data-id="2026"><rect x="204" y="8" width="176" height="40" fill="var(--pele-series-2,#f58518)" style="rx:var(--_r)"/><text fill="var(--_bg)" x="292" y="33.6" text-anchor="middle">2026</text><path class="pele-edge" d="M292,48V88M292,125V133" fill="none" stroke="var(--_b)"/><circle class="pele-dot" cx="292" cy="68" r="4" fill="var(--pele-series-2,#f58518)" stroke="var(--_bg)" stroke-width="2"/><circle cx="292" cy="68" r="8.5" fill="none" stroke="#818CF8" stroke-width="1.4" class="mmd-pulse" style="animation-delay:-0.45s"/><g class="pele-node pele-event"><rect x="204" y="88" width="176" height="37" fill="var(--pele-series-2,#f58518)" fill-opacity="0.16" style="rx:var(--_r)"/><text font-size="14" x="292" y="111.4" text-anchor="middle">ACP Protocol</text></g><g class="pele-node pele-event"><rect x="204" y="133" width="176" height="37" fill="var(--pele-series-2,#f58518)" fill-opacity="0.16" style="rx:var(--_r)"/><text font-size="14" x="292" y="156.4" text-anchor="middle">OpenCode &amp; AG-UI</text></g></g>
    <g class="mmd-packets"><circle r="4.2" fill="#38BDF8"><animateMotion dur="3.20s" begin="-0.90s" repeatCount="indefinite"><mpath href="#mmd-axis"/></animateMotion></circle></g>
  </g>

  <rect x="68" y="278" width="376" height="30" rx="15" class="mmd-card"/>
  <text x="256" y="297" text-anchor="middle" class="mmd-footer">timeline with axis pulse &amp; milestone halos</text>
</svg>
